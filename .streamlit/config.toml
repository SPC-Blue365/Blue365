[client]
toolbarMode = "viewer"

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
# Blue365 UI 스타일(docs/UI_디자인_가이드.md): 회색 바탕 + 흰 카드 + 파랑 한 색 강조(빨강은 '위험' 상태색으로만 사용)
base = "light"
primaryColor = "#3182f6"
backgroundColor = "#f2f4f6"
secondaryBackgroundColor = "#ffffff"
textColor = "#191f28"
baseRadius = "0.75rem"
borderColor = "#e5e8eb"
