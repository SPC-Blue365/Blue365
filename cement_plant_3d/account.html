<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blue365 사용자 관리</title>
<style>
/* 레이아웃: 상단 바 + 가운데 카드 열 (01 승인 대기 · 02 사용자 · 03 기록 · 내 계정) */
:root{--bg:#F2F4F6;--card:#FFFFFF;--pv:#F4F6F9;--line:#E5E8EB;--fg:#191F28;--fg2:#4E5968;--fg3:#8B95A1;--accent:#3182F6;--accent-soft:#E8F3FF;--ok:#0E9F6E;--ok-soft:#E3F6EE;--bad:#E5484D;--bad-soft:#FDECEC;--warn:#D98200;--warn-soft:#FFF3DF;--idle:#EEF1F4;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1115;--card:#1A1D23;--pv:#22262D;--line:#2C3139;--fg:#F2F4F6;--fg2:#B0B8C1;--fg3:#7E8794;--accent:#4A90F7;--accent-soft:#1B2B45;--ok:#2FBF85;--ok-soft:#173129;--bad:#F2646A;--bad-soft:#3D1D20;--warn:#F5A623;--warn-soft:#3A2D14;--idle:#262A31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1115;--card:#1A1D23;--pv:#22262D;--line:#2C3139;--fg:#F2F4F6;--fg2:#B0B8C1;--fg3:#7E8794;--accent:#4A90F7;--accent-soft:#1B2B45;--ok:#2FBF85;--ok-soft:#173129;--bad:#F2646A;--bad-soft:#3D1D20;--warn:#F5A623;--warn-soft:#3A2D14;--idle:#262A31;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;height:60px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top b{font-size:16px}.top .sp{flex:1}
.lnk{color:var(--accent);font-weight:700;text-decoration:none}
.btn{height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--pv);color:var(--fg2)}.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.wrap{max-width:1100px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;line-height:1.35;margin:0;letter-spacing:-.5px}h1 em{font-style:normal;color:var(--accent)}
.lead{color:var(--fg3);margin:6px 0 0}
.card{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:14px}
.pv{background:var(--pv);border-radius:14px;padding:12px;overflow-x:auto}
.meta{display:flex;gap:12px;padding:0 4px 4px}.meta .n{font-weight:800;color:var(--accent)}.meta b{display:block;font-size:15px}.meta small{color:var(--fg3);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{font-size:11.5px;color:var(--fg3);font-weight:600;text-align:left;padding:4px 8px 8px;white-space:nowrap}
td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}
td small{color:var(--fg3)}
.badge{display:inline-flex;font-size:12px;font-weight:700;border-radius:8px;padding:4px 9px;white-space:nowrap}
.s-ok{color:var(--ok);background:var(--ok-soft)}.s-warn{color:var(--warn);background:var(--warn-soft)}.s-bad{color:var(--bad);background:var(--bad-soft)}.s-idle{color:var(--fg2);background:var(--idle)}.s-act{color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;background:var(--card);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:5px 10px;border-radius:8px;font-weight:700;color:var(--fg3);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--fg3);padding:18px;text-align:center}
form.pw{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
form.pw label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg2);font-weight:600}
form.pw input{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;min-width:180px}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--bg);border-radius:14px;padding:11px 16px;font-weight:600;animation:tin .3s var(--ease)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.temp{font-family:ui-monospace,Consolas,monospace;font-size:15px;font-weight:700;user-select:all}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="top"><a class="lnk" href="/">← 공정 화면</a><span class="sp"></span><b id="who"></b><button class="btn ghost" type="button" id="out">로그아웃</button></header>
<main class="wrap">
  <div><h1 id="head">내 계정</h1><p class="lead" id="lead"></p></div>
  <section id="admin" hidden style="display:flex;flex-direction:column;gap:18px">
    <article class="card"><div class="pv" id="pending"></div><div class="meta"><span class="n">01</span><div><b>승인 대기</b><small>ID 등록 요청을 보고 편집 또는 뷰어로 승인하거나 거절합니다. 편집은 데이터 업로드, 뷰어는 보기만 가능합니다.</small></div></div></article>
    <article class="card"><div class="pv" id="users"></div><div class="meta"><span class="n">02</span><div><b>사용자</b><small>권한을 바꾸면 그 사용자는 다시 로그인해야 합니다. 비밀번호 초기화 시 임시 비밀번호를 본인에게 전달하세요.</small></div></div></article>
    <article class="card"><div class="pv" id="audit"></div><div class="meta"><span class="n">03</span><div><b>최근 기록</b><small>로그인·등록 요청·승인·권한 변경·업로드 기록 (서버 PC의 data/audit.log)</small></div></div></article>
  </section>
  <article class="card"><div class="pv"><form class="pw" id="pwForm"><label for="pOld">현재 비밀번호<input id="pOld" type="password" autocomplete="current-password" required></label><label for="pNew">새 비밀번호 (영문+숫자 8자 이상)<input id="pNew" type="password" autocomplete="new-password" required minlength="8"></label><label for="pNew2">새 비밀번호 확인<input id="pNew2" type="password" autocomplete="new-password" required minlength="8"></label><button class="btn" type="submit">비밀번호 바꾸기</button></form></div><div class="meta"><span class="n" id="pwN">04</span><div><b>내 비밀번호</b><small>임시 비밀번호를 받았다면 여기서 바로 바꿔 주세요.</small></div></div></article>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
(function(){'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const RK={viewer:'뷰어',editor:'편집',admin:'관리자'},SK={pending:['승인 대기','s-warn'],active:['사용 중','s-ok'],rejected:['거절','s-bad'],disabled:['사용 중지','s-idle']};
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),4200);};
const dt=s=>s?s.replace('T',' ').slice(2,16):'—';
async function api(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'}:{cache:'no-store',credentials:'same-origin'});
  if(r.status===401){location.replace('/login');throw new Error('로그인이 필요합니다');}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('오류 '+r.status));return j;}
let ME=null;const pick={};
async function load(){
  const m=await api('api/me');ME=m.user;if(!ME){location.replace('/login');return;}
  $('#who').textContent=`${ME.dept} ${ME.name} · ${RK[ME.role]}`;
  if(ME.role!=='admin'){$('#head').textContent='내 계정';$('#lead').textContent=`${ME.id} · ${RK[ME.role]} 권한`;$('#pwN').textContent='01';return;}
  const d=await api('api/admin/users');const pend=d.users.filter(u=>u.status==='pending'),rest=d.users.filter(u=>u.status!=='pending');
  $('#admin').hidden=false;
  $('#head').innerHTML=pend.length?`승인을 기다리는 요청이 <em>${pend.length}건</em> 있습니다`:'승인 대기 요청이 <em>없습니다</em>';
  $('#lead').textContent=`사용자 ${rest.filter(u=>u.status==='active').length}명 사용 중 · 관리자 ${ME.dept} ${ME.name}`;
  $('#pending').innerHTML=pend.length?`<table><thead><tr><th>신청 시각</th><th>부서</th><th>이름</th><th>아이디</th><th>접속 IP</th><th>권한</th><th></th></tr></thead><tbody>${pend.map(u=>{pick[u.id]=pick[u.id]||'viewer';return `<tr><td>${dt(u.created)}</td><td>${esc(u.dept)}</td><td><b>${esc(u.name)}</b></td><td>${esc(u.id)}</td><td><small>${esc(u.ip)}</small></td>
    <td><div class="seg" role="radiogroup" aria-label="${esc(u.id)} 권한">${['editor','viewer'].map(r=>`<button type="button" role="radio" aria-checked="${pick[u.id]===r}" class="${pick[u.id]===r?'on':''}" data-pick="${esc(u.id)}" data-role="${r}">${RK[r]}</button>`).join('')}</div></td>
    <td><div class="acts"><button class="btn" type="button" data-act="approve" data-id="${esc(u.id)}">승인</button><button class="btn bad" type="button" data-act="reject" data-id="${esc(u.id)}">거절</button></div></td></tr>`;}).join('')}</tbody></table>`:'<div class="empty">승인을 기다리는 요청이 없습니다.</div>';
  $('#users').innerHTML=rest.length?`<table><thead><tr><th>부서</th><th>이름</th><th>아이디</th><th>권한</th><th>상태</th><th>마지막 로그인</th><th>승인</th><th></th></tr></thead><tbody>${rest.map(u=>{const self=u.id.toLowerCase()===ME.id.toLowerCase(),st=SK[u.status]||[u.status,'s-idle'];
    return `<tr><td>${esc(u.dept)}</td><td><b>${esc(u.name)}</b>${self?' <small>(나)</small>':''}</td><td>${esc(u.id)}</td>
     <td>${self?`<span class="badge s-act">${RK[u.role]}</span>`:`<select data-rolesel="${esc(u.id)}" aria-label="${esc(u.id)} 권한">${['viewer','editor','admin'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${RK[r]}</option>`).join('')}</select>`}</td>
     <td><span class="badge ${st[1]}">${st[0]}</span></td><td>${dt(u.lastLogin)} <small>${esc(u.lastIp||'')}</small></td><td><small>${esc(u.approvedBy||'')} ${dt(u.approvedAt)}</small></td>
     <td>${self?'':`<div class="acts"><button class="btn ghost" type="button" data-act="role" data-id="${esc(u.id)}">권한 저장</button>${u.status==='disabled'||u.status==='rejected'?`<button class="btn ghost" type="button" data-act="enable" data-id="${esc(u.id)}">사용 재개</button>`:`<button class="btn ghost" type="button" data-act="disable" data-id="${esc(u.id)}">사용 중지</button>`}<button class="btn ghost" type="button" data-act="reset" data-id="${esc(u.id)}">비밀번호 초기화</button><button class="btn bad" type="button" data-act="delete" data-id="${esc(u.id)}">삭제</button></div>`}</td></tr>`;}).join('')}</tbody></table>`:'<div class="empty">아직 사용자가 없습니다.</div>';
  $('#audit').innerHTML=d.audit.length?`<table><thead><tr><th>시각</th><th>사용자</th><th>내용</th><th>상세</th><th>IP</th></tr></thead><tbody>${d.audit.map(a=>`<tr><td>${esc(a.t)}</td><td>${esc(a.who)}</td><td>${esc(a.act)}</td><td>${esc(a.detail)}</td><td><small>${esc(a.ip)}</small></td></tr>`).join('')}</tbody></table>`:'<div class="empty">기록이 없습니다.</div>';
  $$('[data-pick]').forEach(b=>b.onclick=()=>{pick[b.dataset.pick]=b.dataset.role;load();});
  $$('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.id,b));
}
const confirmOnce={};
async function act(a,id,btn){
  // 되돌리기 어려운 작업은 한 번 더 눌러 확인 (브라우저 확인창 대신)
  if(['delete','reject','reset'].includes(a)){const k=a+id;if(!confirmOnce[k]){confirmOnce[k]=1;btn.textContent='한 번 더 누르면 실행';setTimeout(()=>{delete confirmOnce[k];},4000);return;}delete confirmOnce[k];}
  const body={id,action:a};
  if(a==='approve')body.role=pick[id]||'viewer';
  if(a==='role'){const sel=document.querySelector(`[data-rolesel="${CSS.escape(id)}"]`);body.role=sel&&sel.value;}
  btn.disabled=true;
  try{const j=await api('api/admin/user',body);
    if(a==='reset'){const t=document.createElement('div');t.className='toast';t.innerHTML=`${esc(id)} 임시 비밀번호: <span class="temp">${esc(j.temp)}</span> (지금만 보입니다)`;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),20000);}
    else toast({approve:`${id} 승인 (${RK[body.role]})`,reject:`${id} 거절`,role:`${id} 권한 → ${RK[body.role]}`,disable:`${id} 사용 중지`,enable:`${id} 사용 재개`,delete:`${id} 삭제`}[a]||'처리했습니다');
    await load();}
  catch(e){toast(e.message);btn.disabled=false;}
}
$('#pwForm').onsubmit=async e=>{e.preventDefault();if($('#pNew').value!==$('#pNew2').value){toast('새 비밀번호 확인이 일치하지 않습니다');return;}
  try{await api('api/password',{old:$('#pOld').value,new:$('#pNew').value});$('#pwForm').reset();toast('비밀번호를 바꿨습니다');}catch(err){toast(err.message);}};
$('#out').onclick=async()=>{await fetch('api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',credentials:'same-origin'});location.replace('/login');};
load().catch(e=>toast(e.message));setInterval(()=>{if(ME&&ME.role==='admin'&&!document.querySelector('[data-pick]:focus,select:focus,input:focus'))load().catch(()=>{});},15000);
})();
</script>
</body>
</html>
