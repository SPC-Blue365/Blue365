<title>Blue365 공정 지도</title>
<style>
/* 레이아웃: 왼쪽 세로 메뉴 + 상단 바 + 전체 화면 3D 공정 지도 위에 흰 카드 오버레이 (Blue365 UI) */
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --preview:#F4F6F9; --line:#E5E8EB;
  --fg:#191F28; --fg2:#4E5968; --fg3:#8B95A1;
  --accent:#3182F6; --accent-soft:#E8F3FF; --on-accent:#FFFFFF;
  --ok:#0E9F6E; --ok-soft:#E3F6EE; --warn:#D98200; --warn-soft:#FFF3DF; --bad:#E5484D; --bad-soft:#FDECEC; --idle-soft:#EEF1F4;
  --shadow:0 8px 28px rgba(25,31,40,.08),0 1px 3px rgba(25,31,40,.06);
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --r:20px; --side:236px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --card:#1A1D23; --preview:#22262D; --line:#2C3139;
  --fg:#F2F4F6; --fg2:#B0B8C1; --fg3:#7E8794;
  --accent:#4A90F7; --accent-soft:#1B2B45; --on-accent:#FFFFFF;
  --ok:#2FBF85; --ok-soft:#173129; --warn:#F5A623; --warn-soft:#3A2D14; --bad:#F2646A; --bad-soft:#3D1D20; --idle-soft:#262A31;
  --shadow:0 8px 28px rgba(0,0,0,.38),0 1px 3px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1115; --card:#1A1D23; --preview:#22262D; --line:#2C3139;
  --fg:#F2F4F6; --fg2:#B0B8C1; --fg3:#7E8794;
  --accent:#4A90F7; --accent-soft:#1B2B45; --on-accent:#FFFFFF;
  --ok:#2FBF85; --ok-soft:#173129; --warn:#F5A623; --warn-soft:#3A2D14; --bad:#F2646A; --bad-soft:#3D1D20; --idle-soft:#262A31;
  --shadow:0 8px 28px rgba(0,0,0,.38),0 1px 3px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex;height:100%}
.side{width:var(--side);flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;gap:6px;transition:width .28s var(--ease);overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.logo .ic{width:20px;height:20px}
.brand b{font-size:17px;letter-spacing:-.2px;display:block}
.brand small{font-size:11.5px;color:var(--fg3)}
.grp{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--fg3);font-weight:600;letter-spacing:.4px;padding:14px 10px 6px;white-space:nowrap}
.grp button{color:var(--fg3);display:grid;place-items:center;width:22px;height:22px;border-radius:6px}
.grp button:hover{background:var(--preview)}
.grp button .ic{width:16px;height:16px;transition:transform .25s var(--ease)}
.grp.closed button .ic{transform:rotate(-90deg)}
.nav{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;color:var(--fg2);font-weight:600;white-space:nowrap;position:relative;width:100%;text-align:left}
.nav:hover{background:var(--preview)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav > span:not([data-ic]){flex:1;min-width:0}
.nav [data-ic]{flex:none;display:grid}
.nb{font-style:normal;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;background:var(--bad);color:#fff}
.nb.w{background:var(--warn-soft);color:var(--warn)}
.nb.z{background:var(--idle-soft);color:var(--fg3)}
#areaNav{display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:max-height .3s var(--ease)}
.grp.closed + #areaNav{max-height:0!important}
.side-foot{margin-top:auto}
.app.collapsed{--side:76px}
.app.collapsed .side .brand div,.app.collapsed .side .nav span,.app.collapsed .side .grp span,.app.collapsed .side .grp button{display:none}
.app.collapsed .side .nav .nb{position:absolute;top:4px;right:6px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
.app.collapsed .side .grp{padding:10px 0 4px;justify-content:center}
.app.collapsed .side .grp::before{content:"";width:24px;height:1px;background:var(--line)}
.app.collapsed .side .nav{justify-content:center;padding:10px 0}
.app.collapsed .side-foot .ic{transform:rotate(180deg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:30}
.top .mbrand{display:none;align-items:center;gap:8px;font-weight:700}
.top .mbrand .logo{width:28px;height:28px;border-radius:8px}
.top .mbrand .logo .ic{width:16px;height:16px}
.search{position:relative;flex:1;max-width:440px;min-width:0}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg3);width:18px;height:18px}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:0 40px 0 38px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--card)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px var(--font);color:var(--fg3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.results{position:absolute;top:46px;left:0;right:0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:6px;max-height:340px;overflow:auto}
.results button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.results button:hover,.results button.hi{background:var(--preview)}
.results small{color:var(--fg3);margin-left:auto;white-space:nowrap}
.results .empty{padding:12px;color:var(--fg3)}
.spacer{flex:1}
.plant{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:12px;white-space:nowrap}
.plant .code{background:var(--accent);color:var(--on-accent);font-weight:800;font-size:12px;border-radius:8px;padding:5px 7px}
.plant b{display:block;font-size:13px}
.plant small{font-size:11.5px;color:var(--fg3)}
.live{display:inline-flex;align-items:center;gap:7px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:13px;border-radius:999px;padding:6px 12px;white-space:nowrap}
.live.data{background:var(--accent-soft);color:var(--accent)}
.live.data i{background:var(--accent);animation:none}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg2);position:relative;flex:none}
.icon-btn:hover{background:var(--preview)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.user{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
.user b{display:block;font-size:13px}
.user small{font-size:11.5px;color:var(--fg3)}
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0}
.scroll{overflow:auto;padding:24px 28px 40px}

/* ---------- map view ---------- */
#stage{position:absolute;inset:0;outline:none;touch-action:none;cursor:grab;background:var(--bg)}
#stage.drag{cursor:grabbing}
#stage.hover{cursor:pointer}
#stage canvas{display:block}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--card);color:var(--fg);font-size:12px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;will-change:transform;transition:background .2s,color .2s}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.tag.s-warn i{background:var(--warn)} .tag.s-bad i{background:var(--bad)} .tag.s-none i{background:var(--fg3)}
.tag small{font-weight:500;color:var(--fg3)}
.tag.sel{background:var(--accent);color:var(--on-accent);z-index:2}
.tag.sel small{color:var(--on-accent);opacity:.85}
.tag.sel i{background:var(--on-accent)}
.tag.mini{padding:4px 8px;font-size:11px}
.panel{position:absolute;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);z-index:5}
.kpis{position:absolute;left:16px;top:16px;display:grid;grid-template-columns:repeat(4,minmax(0,212px));gap:12px;width:calc(100% - 470px);z-index:5}
.views.nodetail .kpis{width:calc(100% - 100px)}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi > div{min-width:0}
.kpi .kic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.kpi .kl{font-size:12px;color:var(--fg2);display:flex;align-items:center;gap:4px}
.kpi .kval{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.25;display:flex;align-items:baseline;gap:6px}
.kpi .kval small{font-size:12px;font-weight:600;color:var(--fg3)}
.kpi .ks{font-size:11.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.kpi .kl{white-space:nowrap}
.delta{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 5px}
.delta.up{color:var(--ok);background:var(--ok-soft)} .delta.dn{color:var(--bad);background:var(--bad-soft)} .delta.nt{color:var(--fg3);background:var(--idle-soft)}
.ctrls{position:absolute;top:16px;right:372px;display:flex;flex-direction:column;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px;z-index:5;transition:right .3s var(--ease)}
.ctrls button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg2)}
.ctrls button:hover{background:var(--preview);color:var(--accent)}
.ctrls hr{border:0;height:1px;background:var(--line);margin:3px 6px}
.views.nodetail .ctrls{right:16px}
.vchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}

.detail{top:16px;right:16px;width:344px;max-height:calc(100% - 340px);min-height:220px;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;transition:transform .32s var(--ease),opacity .32s var(--ease)}
.dp-head{display:flex;gap:12px;align-items:flex-start}
.dp-ico{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.dp-ico .ic{width:22px;height:22px}
.eyebrow{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.6px}
.dp-name{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-top:1px}
.dp-sub{font-size:12px;color:var(--fg3);margin-top:2px}
.dp-act{margin-left:auto;display:flex;gap:4px}
.dp-act button{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--fg3);border:1px solid var(--line)}
.dp-act button:hover{color:var(--accent);border-color:var(--accent)}
.dp-act .ic{width:16px;height:16px}
.dp-st{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg2);flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:8px;padding:4px 9px;white-space:nowrap}
.badge.s-ok{color:var(--ok);background:var(--ok-soft)}
.badge.s-warn{color:var(--warn);background:var(--warn-soft)}
.badge.s-bad{color:var(--bad);background:var(--bad-soft)}
.badge.s-act{color:var(--accent);background:var(--accent-soft)}
.badge.s-idle,.badge.s-none{color:var(--fg2);background:var(--idle-soft)}
.bar{height:6px;border-radius:3px;background:var(--idle-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .6s var(--ease)}
.bar i.s-warn{background:var(--warn)} .bar i.s-bad{background:var(--bad)} .bar i.s-act{background:var(--accent)}
.barrow{display:flex;flex-direction:column;gap:6px}
.barrow .bl{display:flex;justify-content:space-between;font-size:12px;color:var(--fg3)}
.barrow .bl b{color:var(--fg);font-weight:700}
.spark{background:var(--preview);border-radius:14px;padding:10px 12px 6px}
.spark .sh{display:flex;justify-content:space-between;font-size:12px;color:var(--fg3);margin-bottom:2px}
.spark .sh b{color:var(--fg)}
.spark svg{width:100%;height:64px;display:block}
.kv{margin:0;display:flex;flex-direction:column}
.kv div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--fg2);display:flex;align-items:center;gap:6px;min-width:0}
.kv dd{margin:0;font-weight:700;text-align:right;white-space:nowrap}
.kv dd small{font-weight:500;color:var(--fg3);margin-left:3px}
.kv dd .lim{display:block;font-size:11px;font-weight:500;color:var(--fg3)}
.kv dt i{width:6px;height:6px;border-radius:50%;background:transparent;flex:none}
.kv dt i.s-warn{background:var(--warn)} .kv dt i.s-bad{background:var(--bad)}
.sect{font-size:12px;font-weight:700;color:var(--fg2);display:flex;justify-content:space-between;align-items:center}
.sect small{font-weight:500;color:var(--fg3)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{background:var(--preview);border-radius:12px;padding:8px 8px 7px;text-align:center}
.chip small{display:block;font-size:11px;color:var(--fg3)}
.chip b{font-size:14px}
.chip.s-warn b{color:var(--warn)} .chip.s-bad b{color:var(--bad)}
.note{font-size:11.5px;color:var(--fg3);line-height:1.5}

.lot{left:16px;bottom:16px;right:448px;max-width:820px;padding:16px 18px;display:flex;gap:16px;align-items:stretch}
.lot-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.lot-h{display:flex;align-items:center;gap:10px;font-weight:700}
.lot-h .ic{color:var(--accent)}
.lot-h small{margin-left:auto;font-weight:500;color:var(--fg3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:grid;grid-template-columns:repeat(6,1fr);position:relative}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center;min-width:0}
.step::before{content:"";position:absolute;top:17px;left:calc(-50% + 20px);right:calc(50% + 20px);height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--accent)}
.step .sb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--idle-soft);color:var(--fg3);position:relative;z-index:1}
.step .sb .ic{width:17px;height:17px}
.step.done .sb{background:var(--accent);color:var(--on-accent)}
.step.cur .sb{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 5px var(--accent-soft)}
.step b{font-size:12px;font-weight:700;white-space:nowrap}
.step small{font-size:11px;color:var(--fg3);white-space:nowrap}
.step.cur small{color:var(--accent);font-weight:600}
.lot-side{width:236px;flex:none;background:var(--preview);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fg2)}
.lot-side b.id{font-size:14px;color:var(--fg)}
.lot-side .row{display:flex;justify-content:space-between;gap:8px}
.lot-side .row span:last-child{color:var(--fg);font-weight:600;text-align:right}

.list{right:16px;bottom:16px;width:416px;padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px}
.list-h{display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;background:var(--preview);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--fg2);white-space:nowrap;transition:background .2s var(--ease),color .2s}
.seg button em{font-style:normal;color:var(--fg3);font-weight:600;margin-left:4px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on em{color:var(--accent)}
.list-h small{margin-left:auto;color:var(--fg3);font-size:12px;white-space:nowrap}
.rows{max-height:212px;overflow:auto;margin:0 -6px}
.rw{display:grid;grid-template-columns:94px 1fr auto 52px 14px;gap:10px;align-items:center;padding:9px 6px;border-radius:12px;width:100%;text-align:left}
.rw:hover{background:var(--preview)}
.rw.on{background:var(--accent-soft)}
.rw .a b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .a small{display:block;font-size:11px;color:var(--fg3);white-space:nowrap}
.rw .d{font-size:12px;color:var(--fg2);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .d i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.rw .p{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg3);text-align:right}
.rw .ic{width:14px;height:14px;color:var(--fg3)}
.fab{display:none}
.sheet-handle{display:none}

/* ---------- report & alarm ---------- */
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.banner{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent);border-radius:16px;padding:12px 16px;font-size:13px;font-weight:600}
.banner span{color:var(--fg2);font-weight:500}
.headline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.headline .eb{font-size:13px;color:var(--fg3);font-weight:600;margin-bottom:8px}
.headline h1{font-size:30px;line-height:1.32;letter-spacing:-.6px;margin:0;font-weight:800;text-wrap:balance}
.headline h1 em{font-style:normal;color:var(--accent)}
.headline p{margin:8px 0 0;color:var(--fg3);font-size:13px}
.krow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.krow .kpi{width:auto;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.w2{grid-column:span 2}
.pv{background:var(--preview);border-radius:14px;padding:16px;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}
.meta{padding:0 4px 4px;display:flex;gap:12px;align-items:flex-start}
.meta .n{font-weight:800;color:var(--accent);font-size:14px}
.meta b{display:block;font-size:15px}
.meta small{display:block;color:var(--fg3);font-size:12.5px;margin-top:2px;line-height:1.45}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tk{fill:var(--fg3);font-size:11px;font-family:var(--font)}
.chart .b{fill:var(--accent);opacity:.42}
.chart .b.now{opacity:1}
.chart .b.warn{fill:var(--warn);opacity:1}

function stepTruck(t,dt){
  if(t.respawn>0){t.respawn-=dt;if(t.respawn<=0){newLot(t);t.i=1;t.x=t.route[0][0];t.z=t.route[0][1];t.s=0;t.state='진입';t.g.visible=true;}return;}
  if(t.wait>0){
    t.wait-=dt;
    const f=1-Math.max(0,t.wait)/(t.waitTot||1);
    if(t.loading)t.load=Math.min(t.cap,Math.max(t.load,t.cap*f));
    if(t.filling)t.load=t.cap*f;
    if(t.dumping)t.load=t.cap*(1-f);
    if(t.wait<=0){t.loading=t.filling=t.dumping=false;}
    return;
  }
  const w=t.route[t.i];const dx=w[0]-t.x,dz=w[1]-t.z,dist=Math.hypot(dx,dz);
  if(t.kind==='bct'&&TRUCKS.some(o=>o!==t&&o.kind==='bct'&&o.respawn<=0&&o.s>t.s&&o.s-t.s<11))return;
  const step=t.speed*dt;
  const tg=Math.atan2(-dz,dx);let dr=tg-t.g.rotation.y;while(dr>Math.PI)dr-=2*Math.PI;while(dr<-Math.PI)dr+=2*Math.PI;t.g.rotation.y+=dr*Math.min(1,dt*8);
  if(step>=dist){
    t.x=w[0];t.z=w[1];t.s+=dist;
    const o=w[2]||{};
    if(o.state)t.state=o.state;
    if(o.wait){t.wait=t.waitTot=o.wait;t.loading=!!o.load;t.filling=!!o.fill;t.dumping=!!o.dump;}
    if(o.state==='출하')t.doneAt=new Date();
    t.i++;
    if(o.end){if(MODE==='sim')E.DSP.params.ship.v+=t.load;t.g.visible=false;t.respawn=4+Math.random()*6;if(sel&&sel.type==='truck'&&sel.id===t.id)select(null);}
    if(t.i>=t.route.length)t.i=0;
  }else{t.x+=dx/dist*step;t.z+=dz/dist*step;t.s+=step;}
  t.g.position.set(t.x,0,t.z);
  if(t.g.userData.pile)t.g.userData.pile.visible=t.load>5;
}

function setupControls(){
  const st=$('#stage');const pts=new Map();let mode=null,moved=0,last=null,pinch=null;
  st.addEventListener('contextmenu',e=>e.preventDefault());
  st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;last={x:e.clientX,y:e.clientY};
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),ang:Math.atan2(b.y-a.y,b.x-a.x),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};mode='pinch';}

    st.classList.add('drag');hideHint();});
  st.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)){hover(e);return;}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(mode==='pinch'&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),ang=Math.atan2(b.y-a.y,b.x-a.x),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      goal.dist=clamp(goal.dist*pinch.d/d,40,400);cam.dist=goal.dist;goal.theta-=(ang-pinch.ang);cam.theta=goal.theta;panBy(mx-pinch.mx,my-pinch.my);pinch={d,ang,mx,my};moved+=10;return;}
    const dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};moved+=Math.abs(dx)+Math.abs(dy);
    if(mode==='pan')panBy(dx,dy);
    else if(mode==='rot'){goal.theta-=dx*.006;goal.phi=clamp(goal.phi-dy*.004,.45,1.25);cam.theta=goal.theta;cam.phi=goal.phi;}
  });
  const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size===0){st.classList.remove('drag');if(moved<6&&mode!=='pinch')pick(e);mode=null;}
    else if(pts.size===1){mode='pan';last=[...pts.values()][0];}};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(e.deltaY*.0012));hideHint();},{passive:false});
  st.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft')panBy(40,0);else if(k==='ArrowRight')panBy(-40,0);else if(k==='ArrowUp')panBy(0,40);else if(k==='ArrowDown')panBy(0,-40);else if(k==='+'||k==='=')zoomBy(.8);else if(k==='-')zoomBy(1.25);else if(k==='Escape')select(null);else return;e.preventDefault();});
  $$('[data-cam]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.cam;
    if(a==='in')zoomBy(.75);if(a==='out')zoomBy(1.33);if(a==='rl')goal.theta+=Math.PI/4;if(a==='rr')goal.theta-=Math.PI/4;if(a==='home'){Object.assign(goal,homeView());}
    if(REDUCED)Object.assign(cam,goal);}));
}

function makeBracket(b){
  const s=b.getSize(new THREE.Vector3()),mn=b.min,mx=b.max;const L=Math.min(s.x,s.y,s.z)*.28+.6;const v=[];
  for(const x of [mn.x,mx.x])for(const y of [mn.y,mx.y])for(const z of [mn.z,mx.z]){
    const sx=x===mn.x?1:-1,sy=y===mn.y?1:-1,sz=z===mn.z?1:-1;
    v.push(x,y,z,x+sx*Math.min(L,s.x/2),y,z, x,y,z,x,y+sy*Math.min(L,s.y/2),z, x,y,z,x,y,z+sz*Math.min(L,s.z/2));}

let lastT=performance.now(),flowT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(!THREEOK)return;
  TRUCKS.forEach(t=>stepTruck(t,dt));
  if(view!=='map')return;
  const k=REDUCED?1:1-Math.pow(.0015,dt);
  cam.tx+=(goal.tx-cam.tx)*k;cam.tz+=(goal.tz-cam.tz)*k;cam.dist+=(goal.dist-cam.dist)*k;cam.theta+=(goal.theta-cam.theta)*k;cam.phi+=(goal.phi-cam.phi)*k;
  applyCam();
  FLOWS.forEach(f=>f.parts.forEach(p=>{p.t=(p.t+dt*5/f.tot)%1;const q=along(f,p.t*f.tot);p.m.position.set(q.x,q.y+.5,q.z);}));
  if(KILN&&!REDUCED){KILN.spin.rotation.x+=dt*E.KL.params.rpm.v*.12;KILN.hz.material.opacity=.38+.14*Math.sin(now/600);}
  SMOKE.forEach(s=>{s.userData.t=(s.userData.t+dt*.07)%1;const t=s.userData.t;s.position.set(24+t*7,45+t*16,-22-t*3);s.scale.setScalar(1.2+t*4);s.material.opacity=(dark?.35:.5)*(1-t);});

function sparkSVG(p){
  let h=p.hist.slice(-60);if(h.length===1)h=[h[0],h[0]];if(!h.length)return '';const lo=Math.min(...h,p.lo??Infinity),hi=Math.max(...h,p.hi??-Infinity);
  const rg=(hi-lo)||1;const mn=lo-rg*.12,mx=hi+rg*.12;const W=300,H=64;
  const y=v=>(H-4)-(v-mn)/(mx-mn)*(H-8);const x=i=>i/(h.length-1)*W;
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="chart" aria-hidden="true">`;
  if(p.lo!=null&&p.hi!=null)s+=`<rect class="band" x="0" y="${y(p.hi)}" width="${W}" height="${y(p.lo)-y(p.hi)}"/>`;
  [p.lo,p.hi].forEach(v=>{if(v!=null)s+=`<line class="lim" x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" vector-effect="non-scaling-stroke"/>`;});
  const d=h.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  s+=`<path class="area" d="${d} L${W} ${H} L0 ${H} Z"/><path class="ln" d="${d}" vector-effect="non-scaling-stroke"/>`;
  return s+'</svg>';
}

/* =========================================================
   경영진 요약
   ========================================================= */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const RNG=mulberry(20261109);
const DAYS=[...Array(30)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-29+i);let clk=4985+(RNG()-.5)*190;if(i===20)clk=4130;if(i===21)clk=4720;return {d,clk,fc:1.16+(RNG()-.5)*.36+(i===20?.5:0)};});
DAYS[29].clk=null;
const HOURS=[...Array(24)].map((_,h)=>({h,v:207+(RNG()-.5)*12}));
const FC2H=[...Array(84)].map((_,i)=>{const d=new Date(Date.now()-(83-i)*2*3600e3);return {d,v:1.18+(RNG()-.5)*.42+(i===61?.68:0)};});

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function barChart(vals,labels,o){
  const w=560,h=220,L=48,R=10,T=14,B=26,iw=w-L-R,ih=h-T-B;
  const max=o.max||niceMax(Math.max(...vals.filter(v=>v!=null),o.target||0)*1.08);
  const y=v=>T+ih-v/max*ih;
  let s=`<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="${esc(o.aria)}">`;
  for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);s+=`<line class="gl" x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}"/><text class="tk" x="${L-8}" y="${yy+4}" text-anchor="end">${nf(v)}</text>`;}
  const bw=iw/vals.length;let lastI=-1;vals.forEach((v,i)=>{if(v!=null)lastI=i;});
  vals.forEach((v,i)=>{if(v==null)return;const x=L+i*bw+bw*.18,ww=Math.max(2,bw*.64),yy=y(v);const cls=o.low&&v<o.low?'b warn':(i===lastI?'b now':'b');
    s+=`<rect class="${cls}" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${ww.toFixed(1)}" height="${(T+ih-yy).toFixed(1)}" rx="${Math.min(4,ww/2).toFixed(1)}"><title>${labels[i]} · ${nf(v)} ${o.unit}</title></rect>`;});
  if(o.target){const yy=y(o.target);s+=`<line class="tg" x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}"/><text class="tgl" x="${w-R}" y="${yy-6}" text-anchor="end">목표 ${nf(o.target)}</text>`;}
  const every=Math.ceil(vals.length/7);labels.forEach((lb,i)=>{if(i%every===0)s+=`<text class="tk" x="${(L+i*bw+bw/2).toFixed(1)}" y="${h-7}" text-anchor="middle">${lb}</text>`;});
  return s+'</svg>';
}
function ctrlChart(vals,labels,o){
  const w=560,h=220,L=48,R=12,T=14,B=26,iw=w-L-R,ih=h-T-B;const mn=o.min,mx=o.max;
  const y=v=>T+ih-(clamp(v,mn,mx)-mn)/(mx-mn)*ih;const x=i=>L+(vals.length===1?iw/2:i/(vals.length-1)*iw);
  let s=`<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="${esc(o.aria)}">`;
  s+=`<rect class="band" x="${L}" y="${y(o.hi)}" width="${iw}" height="${y(o.lo)-y(o.hi)}"/>`;
  [mn,o.lo,(o.lo+o.hi)/2,o.hi,mx].forEach(v=>{s+=`<line class="gl" x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}"/><text class="tk" x="${L-8}" y="${y(v)+4}" text-anchor="end">${nf(v,1)}</text>`;});
  [o.lo,o.hi].forEach(v=>s+=`<line class="lim" x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}"/>`);
  s+=`<text class="tgl" x="${w-R}" y="${y(o.hi)-6}" text-anchor="end">관리 상한 ${o.hi}</text><text class="tgl" x="${w-R}" y="${y(o.lo)+14}" text-anchor="end">관리 하한 ${o.lo}</text>`;
  const d=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');

  return s+'</svg>';
}

      fc={vals:FC2H.slice(-12).map(x=>x.v),labels:FC2H.slice(-12).map(x=>hhmm(x.d))};}

function toast(msg,sev='ok'){const w=$('#toasts');const t=document.createElement('div');t.className='toast';t.innerHTML=`<i style="background:var(--${sev==='act'?'accent':sev})"></i>${esc(msg)}`;w.appendChild(t);while(w.children.length>3)w.firstChild.remove();setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320);},3600);}

let evTimer=0;
function tick(){
  if(MODE==='sim'){
    evTimer+=2;
    if(evTimer>=32){evTimer=0;const cand=allParams().filter(x=>x.p.ev);const c=cand[Math.floor(Math.random()*cand.length)];const p=c.p;
      const span=p.lo!=null&&p.hi!=null?p.hi-p.lo:Math.abs(p.hi)*.1;p.target=p.hi-span*.04+Math.random()*span*.12;setTimeout(()=>{p.target=p.base;},16000+Math.random()*8000);}
    allParams().forEach(({e,k,p})=>{
      if(p.counter||p.derived)return;
      p.v+=(p.target-p.v)*.14+gauss()*p.noise;
      if(p.min!=null)p.v=Math.max(p.min,p.v);if(p.max!=null)p.v=Math.min(p.max,p.v);
    });
    const s=E.SIL.params;s.avg.v=(s.s1.v+s.s2.v+s.s3.v+s.s4.v)/4;
    E.DSP.params.wait.v=TRUCKS.filter(t=>t.kind==='bct'&&t.respawn<=0&&(t.state==='진입'||t.state==='계량')).length;
    const lab=E.LAB.params;if(Math.random()<.15){lab.queue.v=clamp(lab.queue.v+(Math.random()<.5?-1:1),2,7);}lab.done.v=Math.min(100,lab.done.v+.05);
    SAMPLES.forEach(x=>{if(x.st==='분석중'||x.st==='채취'||x.st==='양생중'){x.prog=Math.min(x.st==='양생중'?99:100,x.prog+(x.st==='양생중'?.02:.8));if(x.prog>=100){x.st='완료';toast(`${x.id} 분석 완료 · ${x.what}`,'ok');}if(x.st==='채취'&&x.prog>30)x.st='분석중';}});
    allParams().forEach(({e,k,p})=>{p.hist.push(p.v);if(p.hist.length>90)p.hist.shift();
      const st=pStatus(p);if(RANK[st]>RANK[p.prev]){pushAlarm(e,k,p,st);toast(`${e.name} ${p.label} ${nf(p.v,p.dp)}${p.unit} · ${ST[st]}`,st);}p.prev=st;});
  }
  const d=E.DSP.params;if(d.plan.v>0)d.prog.v=d.ship.v/d.plan.v*100;
  renderAll();
}

function setupSearch(){
  const q=$('#q'),res=$('#results');let hi=0,items=[];
  const run=()=>{const v=q.value.trim().toLowerCase();if(!v){res.hidden=true;return;}
    items=[...EQ.map(e=>({k:'eq',id:e.id,t:e.name,s:e.code+' · '+AREA[e.area].name,ic:e.icon,txt:(e.name+e.code+AREA[e.area].name).toLowerCase()})),
      ...TRUCKS.map(t=>({k:'truck',id:t.id,t:t.id,s:t.kind==='bct'?t.lot+' · '+t.state:'덤프 · '+t.state,ic:'truck',txt:(t.id+(t.lot||'')+(t.shp||'')).toLowerCase()})),
      ...SAMPLES.map(x=>({k:'eq',id:x.eq,t:x.id,s:x.what,ic:'flask',txt:(x.id+x.what).toLowerCase()}))].filter(x=>x.txt.includes(v)).slice(0,7);
    hi=0;res.hidden=false;
    res.innerHTML=items.length?items.map((x,i)=>`<button type="button" class="${i===hi?'hi':''}" data-i="${i}">${ic(x.ic)}<span>${esc(x.t)}</span><small>${esc(x.s)}</small></button>`).join(''):'<div class="empty">찾는 항목이 없습니다. 설비명, 코드(KL-1), 차량(BCT-21)으로 검색해 보세요.</div>';
    $$('button',res).forEach(b=>b.onmousedown=ev=>{ev.preventDefault();go(items[+b.dataset.i]);});};
  const go=x=>{if(!x)return;res.hidden=true;q.value='';q.blur();if(view!=='map')location.hash='#map';setTimeout(()=>select({type:x.k,id:x.id},{fly:true}),20);};
  q.addEventListener('input',run);q.addEventListener('focus',run);q.addEventListener('blur',()=>setTimeout(()=>res.hidden=true,120));
  q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go(items[hi]);}else if(e.key==='Escape'){q.value='';res.hidden=true;q.blur();}
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hi=clamp(hi+(e.key==='ArrowDown'?1:-1),0,items.length-1);$$('button',res).forEach((b,i)=>b.classList.toggle('hi',i===hi));}});
  addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();q.focus();}});
}

/* =========================================================

const SCHEMA={

  '생산출하':{req:['일자','클링커생산','시멘트출하','출하계획'],opt:['킬른가동률','S-1','S-2','S-3','S-4']},

/* ---------- .xlsx 읽기 (ZIP + XML) ---------- */
const colIdx=ref=>{let n=0;for(const ch of ref){const c=ch.charCodeAt(0);if(c>=65&&c<=90)n=n*26+c-64;else if(c>=97&&c<=122)n=n*26+c-96;else break;}return n-1;};

  const n=dv.getUint16(eocd+10,true);let off=dv.getUint32(eocd+16,true);const files={};const td=new TextDecoder('utf-8');
  for(let k=0;k<n;k++){

        const t=c.getAttribute('t'),vEl=c.getElementsByTagName('v')[0];let v=null;
        if(t==='s')v=vEl?sst[+vEl.textContent]??null:null;

        else if(t==='b')v=vEl?vEl.textContent==='1':null;

function decodeText(buf){let s=new TextDecoder('utf-8').decode(buf);if(s.includes('�')){try{s=new TextDecoder('euc-kr').decode(buf);}catch(e){}}return s.replace(/^﻿/,'');}

    else if(c==='"')q=true;else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}

async function readFiles(list){
  const files=[...list];if(!files.length)throw new Error('파일을 고르지 않았습니다.');
  const total=files.reduce((a,f)=>a+f.size,0);if(total>MAX_FILE)throw new Error('파일이 너무 큽니다 (최대 25MB). 기간을 나눠 올려 주세요.');

/* ---------- 시트 → 화면 데이터 ---------- */
function matchSheets(raw){
  const out={},rep={warn:[],err:[]};
  for(const [name,rows] of Object.entries(raw||{})){
    if(!Array.isArray(rows))continue;
    let best=null;
    for(let r=0;r<Math.min(6,rows.length);r++){const hdr=(rows[r]||[]).map(normH);
      for(const [sn,sc] of Object.entries(SCHEMA)){const hit=sc.req.filter(c=>hdr.includes(normH(c))).length/sc.req.length+(normH(name)===normH(sn)?.01:0);
        if(hit>.5&&(!best||hit>best.score))best={sn,r,score:hit,hdr};}}
    if(!best){if(!/안내|설명|readme/i.test(name))rep.warn.push(`‘${name}’ 시트는 양식과 맞지 않아 건너뛰었습니다.`);continue;}
    const sc=SCHEMA[best.sn],miss=sc.req.filter(c=>!best.hdr.includes(normH(c)));
    if(miss.length){rep.err.push(`‘${name}’ 시트에 ${miss.map(x=>`‘${x}’`).join(', ')} 열이 없습니다.`);continue;}
    const cols={};[...sc.req,...(sc.opt||[])].forEach(c=>{const i=best.hdr.indexOf(normH(c));if(i>=0)cols[c]=i;});
    const recs=[];rows.slice(best.r+1).forEach((r,i)=>{if(!r||!r.some(v=>v!=null&&v!==''))return;const o={_row:best.r+2+i};for(const [c,j] of Object.entries(cols))o[c]=r[j];recs.push(o);});
    if(out[best.sn])out[best.sn].rows.push(...recs);else out[best.sn]={sheet:name,rows:recs};
  }
  return {sheets:out,rep};
}
function buildData(raw){

  let nWarn=0;const bad=(sh,row,msg)=>{nWarn++;if(rep.warn.length<40)rep.warn.push(`${sh} ${row}행: ${msg}`);};
  const eqParam=(sh,r)=>{const e=findEq(r['설비코드']);if(!e){bad(sh,r._row,`설비코드 ‘${r['설비코드']??''}’를 찾을 수 없습니다`);return [];}
    const [k,p]=findParam(e,r['항목코드'],r['항목명']);if(!p){bad(sh,r._row,`${e.code}에 항목코드 ‘${r['항목코드']??''}’가 없습니다`);return [];}return [e,k,p];};

    const lo=toNum(r['하한']),hi=toNum(r['상한']);if(Number.isNaN(lo)||Number.isNaN(hi)){bad('관리기준',r._row,'하한·상한은 숫자로 적어 주세요');continue;}
    if(lo!=null&&hi!=null&&lo>hi){bad('관리기준',r._row,'하한이 상한보다 큽니다');continue;}D.limits.push({e:e.id,k,lo,hi});n++;}D.counts['관리기준']=n;}

    const [e,k,p]=eqParam('공정값',r);if(!p)continue;if(p.derived){bad('공정값',r._row,`‘${p.label}’은 자동 계산 항목이라 건너뜁니다`);continue;}
    const v=toNum(r['값']);if(v==null||Number.isNaN(v)){bad('공정값',r._row,'값이 비었거나 숫자가 아닙니다');continue;}
    (D.params[e.id+'.'+k]||(D.params[e.id+'.'+k]=[])).push({t,v});n++;}D.counts['공정값']=n;}

    const o={t};let ok=true;for(const [c,k] of XR){const v=toNum(r[c]);if(v==null||Number.isNaN(v)){bad('클링커XRF',r._row,`${c} 값이 비었거나 숫자가 아닙니다`);ok=false;break;}o[k]=v;}
    if(ok&&(o.sio2<=0||o.fe<=0)){bad('클링커XRF',r._row,'SiO2·Fe2O3는 0보다 커야 합니다');ok=false;}if(ok)D.xrf.push(o);}D.counts['클링커XRF']=D.xrf.length;}

    if(!ok){bad('시멘트품질',r._row,'Blaine·SO3·MgO·강열감량은 꼭 채워 주세요');continue;}D.cem.push(o);}D.counts['시멘트품질']=D.cem.length;}

    const clk=toNum(r['클링커생산']),ship=toNum(r['시멘트출하']),plan=toNum(r['출하계획']);
    if([clk,ship,plan].some(v=>v==null||Number.isNaN(v))){bad('생산출하',r._row,'클링커생산·시멘트출하·출하계획은 숫자로 채워 주세요');continue;}
    const o={t,clk,ship,plan,run:toNum(r['킬른가동률'])};['S-1','S-2','S-3','S-4'].forEach((c,i)=>{const v=toNum(r[c]);o['s'+(i+1)]=Number.isNaN(v)?null:v;});if(Number.isNaN(o.run))o.run=null;D.prod.push(o);}D.counts['생산출하']=D.prod.length;}

  else if(Object.keys(sheets).length&&!total)rep.err.push('읽을 수 있는 데이터 행이 없습니다.');
  D.total=total;return D;
}

/* 가상 데이터 기준점 (되돌리기용) */
const BASE={params:new Map(),alarms:null};
function snapBase(){allParams().forEach(({p})=>BASE.params.set(p,{v:p.v,base:p.base,target:p.target,lo:p.lo,hi:p.hi,hist:p.hist.slice()}));BASE.alarms=ALARMS;}
function restoreBase(){allParams().forEach(({p})=>{const b=BASE.params.get(p);Object.assign(p,{v:b.v,base:b.base,target:b.target,lo:b.lo,hi:b.hi,hist:b.hist.slice(),has:false,times:null,time:null});});}
function commitData(D,meta){
  restoreBase();MODE='data';DATA=Object.assign(D,{meta:meta||{}});

  const setS=(p,arr)=>{if(!arr.length)return;const a=arr.slice(-90);p.hist=a.map(x=>x.v);p.times=a.map(x=>x.t);p.v=p.base=p.target=a[a.length-1].v;p.time=a[a.length-1].t;p.has=true;};
  for(const [key,arr] of Object.entries(D.params)){const [id,k]=key.split('.');setS(E[id].params[k],arr);}
  if(D.xrf.length)['cao','sio2','al','fe','mgo','so3','fcao'].forEach(k=>setS(E.CKS.params[k],D.xrf.map(x=>({t:x.t,v:x[k]}))));
  if(D.cem.length){setS(E.CM.params.blaine,D.cem.map(x=>({t:x.t,v:x.blaine})));setS(E.CM.params.so3,D.cem.map(x=>({t:x.t,v:x.so3})));}
  if(D.prod.length){const L=D.prod[D.prod.length-1],dp=E.DSP.params;
    setS(dp.ship,D.prod.map(x=>({t:x.t,v:x.ship})));setS(dp.plan,D.prod.map(x=>({t:x.t,v:x.plan})));
    dp.prog.v=L.plan>0?L.ship/L.plan*100:0;dp.prog.has=true;dp.prog.time=L.t;
    ['s1','s2','s3','s4'].forEach(k=>setS(E.SIL.params[k],D.prod.filter(x=>x[k]!=null).map(x=>({t:x.t,v:x[k]}))));}
  const sp=E.SIL.params,ss=['s1','s2','s3','s4'].filter(k=>sp[k].has);if(ss.length){sp.avg.v=ss.reduce((a,k)=>a+sp[k].v,0)/ss.length;sp.avg.has=true;}
  let latest=null;allParams().forEach(({p})=>{if(p.has&&p.time&&(!latest||p.time>latest))latest=p.time;});
  D.cem.forEach(x=>{if(!latest||x.t>latest)latest=x.t;});D.latest=latest;
  // 알람: 올린 데이터의 흐름에서 관리기준 근접·이탈로 바뀐 시점을 기록
  ALARMS=[];allParams().forEach(({e,k,p})=>{if(!p.has||!p.times)return;const keep=p.v;let prev='ok';
    p.hist.forEach((v,i)=>{p.v=v;const st=pStatus(p);if(RANK[st]>RANK[prev])pushAlarm(e,k,p,st,p.times[i]);prev=st;});p.v=keep;p.prev=pStatus(p);});
  ALARMS.sort((a,b)=>b.t-a.t);
  if(sel&&sel.type==='eq')renderDetail();
  renderAll();if(view==='report')renderReport();
}
function backToSim(){restoreBase();allParams().forEach(({p})=>p.prev=pStatus(p));MODE='sim';DATA=null;ALARMS=BASE.alarms;try{localStorage.removeItem('b365-dataset');}catch(e){}renderAll();toast('가상 데이터로 돌아왔습니다','act');}
function loadRaw(raw,meta,o={}){
  const D=buildData(raw);
  if(!D.total){if(!o.silent)toast('불러올 수 있는 데이터가 없습니다','bad');return false;}
  commitData(D,meta);
  if(!o.silent)toast(o.msg||'데이터를 반영했습니다','ok');
  return true;
}

/* ---------- 팀 공유 서버 (server.py) ---------- */
async function serverInit(){
  if(location.protocol==='file:')return false;
  try{const r=await fetch('api/status',{cache:'no-store'});if(!r.ok)return false;const s=await r.json();if(!s||s.app!=='blue365')return false;SERVER=s;SERVER.loaded=null;}catch(e){return false;}
  await pullServer(true);setInterval(pollServer,20000);renderAll();return true;
}
async function pullServer(first){
  try{const r=await fetch('api/dataset',{cache:'no-store'});if(r.status===404)return;if(!r.ok)throw new Error();
    const ds=await r.json();const m=ds.meta||{};
    if(loadRaw(ds.sheets,m,{silent:first,msg:`팀 데이터가 새로 반영되었습니다 · ${m.uploadedBy||''} ${m.uploadedAt?stamp(new Date(m.uploadedAt)):''}`}))SERVER.loaded=m.version;}
  catch(e){toast('팀 공유 데이터를 불러오지 못했습니다','warn');}
}
async function pollServer(){
  try{const r=await fetch('api/status',{cache:'no-store'});if(!r.ok)throw new Error();const s=await r.json();SERVER.ok=true;SERVER.needKey=s.needKey;SERVER.watch=s.watch;
    if(s.version&&s.version!==SERVER.loaded){SERVER.version=s.version;await pullServer(false);}}
  catch(e){if(SERVER.ok!==false)toast('팀 공유 서버에 연결할 수 없습니다. 다시 연결되면 자동으로 이어집니다','warn');SERVER.ok=false;}
}
function restoreLocal(){
  try{const t=localStorage.getItem('b365-dataset');if(!t)return;const o=JSON.parse(t);loadRaw(o.sheets,o.meta,{silent:true});}catch(e){}
}

/* ---------- 데이터 창 ---------- */
let lastFocus=null;
function openModal(){const m=$('#dataModal');if(m.hidden){lastFocus=document.activeElement;m.hidden=false;}renderDataModal();setTimeout(()=>{const f=$('#dmApply')||$('#drop');f&&f.focus();},30);}
function closeModal(){$('#dataModal').hidden=true;PENDING=null;lastFocus&&lastFocus.focus&&lastFocus.focus();}
async function handleFiles(list){
  let name='';
  try{name=[...list].map(f=>f.name).join(', ');const {raw,fileName}=await readFiles(list);PENDING={raw,fileName,D:buildData(raw)};}
  catch(e){PENDING={raw:{},fileName:name,D:{counts:{},total:0,rep:{err:[e.message||'파일을 읽지 못했습니다.'],warn:[]}}};}
  openModal();
}
function statHTML(){
  const m=DATA&&DATA.meta;
  const badge=MODE==='sim'?'<span class="badge s-idle">가상 데이터</span>':SERVER?'<span class="badge s-act">팀 공유 데이터</span>':'<span class="badge s-act">업로드 데이터 (이 PC)</span>';
  let h=`<div class="stat"><div class="row"><span>지금 표시 중</span>${badge}</div>`;
  if(m)h+=`<div class="row"><span>파일</span><b>${esc(m.fileName||'-')}</b></div><div class="row"><span>올린 사람 · 시각</span><b>${esc(m.uploadedBy||'-')} · ${m.uploadedAt?stamp(new Date(m.uploadedAt)):'-'}</b></div><div class="row"><span>반영한 행</span><b>${Object.entries(DATA.counts).map(([k,v])=>`${k} ${nf(v)}`).join(' · ')}</b></div>`;
  h+=`<div class="row"><span>공유 방식</span><b>${SERVER?(SERVER.ok===false?'팀 공유 서버 연결 끊김 · 재시도 중':'팀 공유 서버 연결됨 · 20초마다 확인')+(SERVER.watch?' · 공유 폴더 자동 읽기 켜짐':''):'이 PC 브라우저에만 반영'}</b></div></div>`;
  return h;
}
function renderDataModal(){
  const b=$('#dmBody');let who='';try{who=localStorage.getItem('b365-who')||'';}catch(e){}
  let h=statHTML();
  if(!PENDING){
    h+=`<label class="drop" id="drop" tabindex="0">${ic('upload')}<b>엑셀(.xlsx)이나 CSV 파일을 끌어다 놓으세요</b><small>또는 눌러서 파일 선택 · 여러 파일을 한 번에 올려도 됩니다</small><input type="file" id="dmFile" accept=".xlsx,.csv,.txt" multiple hidden></label>
    <div class="note">${ic('file','')} 양식: <a class="lnk" href="업로드양식.xlsx" download>업로드양식.xlsx</a> (화면 파일과 같은 폴더) · 시트 5개(공정값, 클링커XRF, 시멘트품질, 생산출하, 관리기준) 가운데 가진 데이터만 채워도 됩니다. 파일은 이 PC에서 읽고, ${SERVER?'팀 공유 서버에만 저장합니다.':'외부로 보내지 않습니다.'}</div>`;
    if(!SERVER)h+=`<div class="note">팀이 같은 데이터를 보려면 사내 PC 한 대에서 <b>server.py</b>를 실행하고, 그 주소(예: http://PC이름:8365)로 접속하세요. 자세한 방법은 README에 있습니다.</div>`;
    if(MODE==='data'&&!SERVER)h+=`<div class="acts"><button class="btn ghost" type="button" id="dmSim">가상 데이터로 돌아가기</button></div>`;
  }else{
    const P=PENDING,r=P.D.rep;
    h+=`<div class="sect">불러오기 결과 <small>${esc(P.fileName)}</small></div><div class="msgs">`+
      Object.entries(P.D.counts).map(([k,v])=>`<div class="msg ${v?'ok':''}">${ic(v?'check':'info')}<span><b>${k}</b> ${nf(v)}행 읽음</span></div>`).join('')+
      r.err.map(x=>`<div class="msg err">${ic('alert')}<span>${esc(x)}</span></div>`).join('')+
      r.warn.map(x=>`<div class="msg">${ic('info')}<span>${esc(x)}</span></div>`).join('')+`</div>`;
    const can=P.D.total>0;
    if(can&&SERVER)h+=`<div class="field"><label for="dmWho">올린 사람</label><input id="dmWho" value="${esc(who)}" placeholder="예: 품질관리팀 홍길동" maxlength="40"></div>`+(SERVER.needKey?`<div class="field"><label for="dmKey">업로드 비밀번호</label><input id="dmKey" type="password" autocomplete="off"></div>`:'');
    if(can&&r.err.length)h+=`<div class="note">오류가 있는 시트는 빼고, 읽은 시트만 반영합니다.</div>`;
    h+=`<div class="acts"><button class="btn ghost" type="button" id="dmCancel">다른 파일 고르기</button>${can?`<button class="btn" type="button" id="dmApply">${SERVER?'팀에 공유하고 적용':'이 화면에 적용'}</button>`:''}</div>`;
  }
  b.innerHTML=h;
  const drop=$('#drop'),inp=$('#dmFile');
  if(drop){inp.onchange=()=>{if(inp.files.length)handleFiles(inp.files);};
    drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click();}};
    ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(t=>drop.addEventListener(t,()=>drop.classList.remove('over')));}
  const sim=$('#dmSim');if(sim)sim.onclick=()=>{backToSim();renderDataModal();};
  const cc=$('#dmCancel');if(cc)cc.onclick=()=>{PENDING=null;renderDataModal();};
  const ap=$('#dmApply');if(ap)ap.onclick=applyPending;
}
async function applyPending(){
  const P=PENDING,btn=$('#dmApply');if(!P)return;btn.disabled=true;
  if(SERVER){
    const who=($('#dmWho')?.value||'').trim()||'이름 없음';try{localStorage.setItem('b365-who',who);}catch(e){}
    btn.textContent='올리는 중…';
    try{const r=await fetch('api/dataset',{method:'POST',headers:{'Content-Type':'application/json','X-Upload-Key':$('#dmKey')?.value||''},body:JSON.stringify({sheets:P.raw,meta:{fileName:P.fileName,uploadedBy:who}})});
      const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('서버 오류 ('+r.status+')'));
      SERVER.loaded=j.meta.version;commitData(P.D,j.meta);closeModal();toast('팀에 공유했습니다. 다른 사람 화면에도 20초 안에 반영됩니다','ok');}
    catch(e){btn.disabled=false;btn.textContent='팀에 공유하고 적용';toast(e.message==='Failed to fetch'?'팀 공유 서버에 연결할 수 없습니다':(e.message||'업로드하지 못했습니다'),'bad');}
  }else{
    const meta={fileName:P.fileName,uploadedBy:'이 PC',uploadedAt:new Date().toISOString()};
    commitData(P.D,meta);
    try{localStorage.setItem('b365-dataset',JSON.stringify({sheets:P.raw,meta}));}catch(e){toast('파일이 커서 다음에 열 때는 다시 올려야 합니다','warn');}
    closeModal();toast('올린 데이터를 화면에 적용했습니다','ok');
  }
}
function setupData(){
  snapBase();
  $('#dataBtn').onclick=openModal;
  $('#dmClose').onclick=closeModal;
  $('#dataModal').addEventListener('click',e=>{if(e.target.id==='dataModal')closeModal();});
  addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dataModal').hidden)closeModal();});
  addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault();});
  addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();handleFiles(e.dataTransfer.files);}});
  serverInit().then(ok=>{if(!ok)restoreLocal();});
}

/* 시작 */
paintIcons();
setupTheme();
setupShell();
setupSearch();
if(THREEOK)initScene();else{$('#stage').innerHTML='<div class="nogl">3D 라이브러리를 불러오지 못했습니다.<br>사내망이라면 오프라인 빌드 파일(cement_plant_3d.html)을 사용하세요.</div>';}
setView(location.hash.slice(1)||'map');
select(sel);
renderAll();
setTimeout(()=>toast(isMobile()?'한 손가락으로 끌어 이동 · 두 손가락으로 확대·회전':'끌어서 이동 · 휠로 확대 · 오른쪽 버튼으로 끌면 회전','act'),900);
setInterval(tick,2000);
requestAnimationFrame(frame);
setupData();
})();
</script>
