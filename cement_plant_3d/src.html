<title>Blue365 공정 지도</title>
<style>
/* 레이아웃: 왼쪽 세로 메뉴 + 상단 바 + 전체 화면 3D 공정 지도 위에 흰 카드 오버레이 (Blue365 UI) */
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --preview:#F4F6F9; --line:#E5E8EB;
  --fg:#191F28; --fg2:#4E5968; --fg3:#8B95A1;
  --accent:#3182F6; --accent-soft:#E8F3FF; --on-accent:#FFFFFF;
  --ok:#0E9F6E; --ok-soft:#E3F6EE; --warn:#D98200; --warn-soft:#FFF3DF; --bad:#E5484D; --bad-soft:#FDECEC; --idle-soft:#EEF1F4;
  --shadow:0 8px 28px rgba(25,31,40,.08),0 1px 3px rgba(25,31,40,.06);
  --font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --r:20px; --side:236px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --card:#1A1D23; --preview:#22262D; --line:#2C3139;
  --fg:#F2F4F6; --fg2:#B0B8C1; --fg3:#7E8794;
  --accent:#4A90F7; --accent-soft:#1B2B45; --on-accent:#FFFFFF;
  --ok:#2FBF85; --ok-soft:#173129; --warn:#F5A623; --warn-soft:#3A2D14; --bad:#F2646A; --bad-soft:#3D1D20; --idle-soft:#262A31;
  --shadow:0 8px 28px rgba(0,0,0,.38),0 1px 3px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1115; --card:#1A1D23; --preview:#22262D; --line:#2C3139;
  --fg:#F2F4F6; --fg2:#B0B8C1; --fg3:#7E8794;
  --accent:#4A90F7; --accent-soft:#1B2B45; --on-accent:#FFFFFF;
  --ok:#2FBF85; --ok-soft:#173129; --warn:#F5A623; --warn-soft:#3A2D14; --bad:#F2646A; --bad-soft:#3D1D20; --idle-soft:#262A31;
  --shadow:0 8px 28px rgba(0,0,0,.38),0 1px 3px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex;height:100%}
.side{width:var(--side);flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;gap:6px;transition:width .28s var(--ease);overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.logo .ic{width:20px;height:20px}
.logo.co{display:flex;align-items:center;width:auto;height:auto;padding:5px 7px;background:#fff;border:1px solid var(--line);border-radius:10px}
.logo.co img{height:24px;width:auto;display:block}
.app.collapsed .logo.co{padding:4px}
.app.collapsed .logo.co img{height:auto;width:42px}
.brand b{font-size:17px;letter-spacing:-.2px;display:block}
.brand small{font-size:11.5px;color:var(--fg3)}
.grp{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--fg3);font-weight:600;letter-spacing:.4px;padding:14px 10px 6px;white-space:nowrap}
.grp button{color:var(--fg3);display:grid;place-items:center;width:22px;height:22px;border-radius:6px}
.grp button:hover{background:var(--preview)}
.grp button .ic{width:16px;height:16px;transition:transform .25s var(--ease)}
.grp.closed button .ic{transform:rotate(-90deg)}
.nav{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;color:var(--fg2);font-weight:600;white-space:nowrap;position:relative;width:100%;text-align:left}
.nav:hover{background:var(--preview)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav > span:not([data-ic]){flex:1;min-width:0}
.nav [data-ic]{flex:none;display:grid}
.nb{font-style:normal;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;background:var(--bad);color:#fff}
.nb.w{background:var(--warn-soft);color:var(--warn)}
.nb.z{background:var(--idle-soft);color:var(--fg3)}
#areaNav{display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:max-height .3s var(--ease)}
.grp.closed + #areaNav,.grp.closed + #kilnNav{max-height:0!important}
.side-foot{margin-top:auto}
.ver{font-size:11px;color:var(--fg3);padding:0 10px 6px;white-space:nowrap}
.app.collapsed .ver{display:none}
.app.collapsed{--side:76px}
.app.collapsed .side .brand div,.app.collapsed .side .nav span,.app.collapsed .side .grp span,.app.collapsed .side .grp button{display:none}
.app.collapsed .side .nav .nb{position:absolute;top:4px;right:6px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
.app.collapsed .side .grp{padding:10px 0 4px;justify-content:center}
.app.collapsed .side .grp::before{content:"";width:24px;height:1px;background:var(--line)}
.app.collapsed .side .nav{justify-content:center;padding:10px 0}
.app.collapsed .side-foot .ic{transform:rotate(180deg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:30}
.top .mbrand{display:none;align-items:center;gap:8px;font-weight:700}
.top .mbrand .logo{width:28px;height:28px;border-radius:8px}
.top .mbrand .logo .ic{width:16px;height:16px}
.top .mbrand .logo.co{display:flex!important;width:auto;height:auto;padding:4px 6px;border-radius:8px}
.top .mbrand .logo.co img{height:18px}
.search{position:relative;flex:1;max-width:440px;min-width:0}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg3);width:18px;height:18px}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:0 40px 0 38px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--card)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px var(--font);color:var(--fg3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.results{position:absolute;top:46px;left:0;right:0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:6px;max-height:340px;overflow:auto}
.results button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.results button:hover,.results button.hi{background:var(--preview)}
.results small{color:var(--fg3);margin-left:auto;white-space:nowrap}
.results .empty{padding:12px;color:var(--fg3)}
.spacer{flex:1}
.plant{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:12px;white-space:nowrap}
.plant .code{background:var(--accent);color:var(--on-accent);font-weight:800;font-size:12px;border-radius:8px;padding:5px 7px}
.plant b{display:block;font-size:13px}
.plant small{font-size:11.5px;color:var(--fg3)}
.live{display:inline-flex;align-items:center;gap:7px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:13px;border-radius:999px;padding:6px 12px;white-space:nowrap}
.live.data{background:var(--accent-soft);color:var(--accent)}
.live.data i{background:var(--accent);animation:none}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg2);position:relative;flex:none}
.icon-btn:hover{background:var(--preview)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.user{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
.user b{display:block;font-size:13px}
.user small{font-size:11.5px;color:var(--fg3)}
.umenu{display:flex;gap:6px;margin-left:4px}
.umenu .icon-btn{position:relative}
@media (max-width:600px){#uOut{display:none}}
.umenu .cnt{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0}
.scroll{overflow:auto;padding:24px 28px 40px}

/* ---------- map view ---------- */
#stage{position:absolute;inset:0;outline:none;touch-action:none;cursor:grab;background:var(--bg)}
#stage.drag{cursor:grabbing}
#stage.hover{cursor:pointer}
#stage canvas{display:block}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--card);color:var(--fg);font-size:12px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;will-change:transform;transition:background .2s,color .2s}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.tag.s-warn i{background:var(--warn)} .tag.s-bad i{background:var(--bad)} .tag.s-none i,.tag.s-stop i{background:var(--fg3)}
.tag small{font-weight:500;color:var(--fg3)}
.tag.sel{background:var(--accent);color:var(--on-accent);z-index:2}
.tag.sel small{color:var(--on-accent);opacity:.85}
.tag.sel i{background:var(--on-accent)}
.tag.mini{padding:4px 8px;font-size:11px}
.panel{position:absolute;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);z-index:5}
.kpis{position:absolute;left:16px;top:16px;display:grid;grid-template-columns:repeat(4,minmax(0,212px));gap:12px;width:calc(100% - 470px);z-index:5}
.views.nodetail .kpis{width:calc(100% - 100px)}
.kpis{display:flex;overflow-x:auto;scrollbar-width:none}
.pbar{position:relative;flex:none;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:6px;max-width:calc(100% - 32px)}
.pbar .seg button{padding:6px 10px}
.pnav{display:flex;align-items:center;gap:2px}
.pbtn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--fg2)}
.pbtn:hover:not(:disabled){background:var(--preview);color:var(--accent)}
.pbtn:disabled{opacity:.3;cursor:default}
.pbtn .ic{width:16px;height:16px}
.plab{position:relative;display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:9px;font-weight:700;font-size:13.5px;white-space:nowrap;cursor:pointer}
.plab:hover{background:var(--preview)}
.plab:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.plab input,.plab select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;font:inherit}
.plab input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}   /* 칸 어디를 눌러도 달력이 열리게 */
.ptil{color:var(--fg3);padding:0 2px}
/* 상황판 보기: 메뉴·상단 바·목록을 숨기고 지도와 카드만 크게 */
.app.wall .side,.app.wall .top,.app.wall .tabbar,.app.wall .list,.app.wall .lot,.app.wall .ctrls,.app.wall .fab{display:none!important}
.app.wall .main{padding-bottom:0}
.app.wall .kpis .kpi{flex-basis:220px;max-width:280px;padding:16px 16px}
.app.wall .kpi .kval{font-size:28px}
.app.wall .kpi .kl{font-size:13px}
.app.wall .kpi .ks{font-size:12.5px}
.app.wall .ptabs button{font-size:15px}
.app.wall .tag{font-size:13px}
.app.wall.idle,.app.wall.idle *{cursor:none!important}
.app.wall.idle .wctl{display:none}
.wallbar{position:absolute;left:16px;bottom:16px;z-index:6;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:8px 12px;font-size:13.5px;max-width:calc(100% - 32px);white-space:nowrap}
.wallbar .logo.co{padding:3px 6px}.wallbar .logo.co img{height:20px}
.wallbar b{font-size:15px}
.wclock{font-weight:700;padding-left:10px;border-left:1px solid var(--line)}
.winfo{color:var(--fg3);font-size:12.5px}
.wctl{display:flex;align-items:center;gap:8px;padding-left:10px;border-left:1px solid var(--line)}
.wlab{color:var(--fg3);font-size:12px}
.wallbar .seg button{padding:5px 9px;font-size:12.5px}
.wallprog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:6;pointer-events:none}
.wallprog i{display:block;height:100%;width:0;background:var(--accent);border-radius:0 3px 3px 0;opacity:.8}
.wallprog.run i{animation:wprog var(--cyc,30s) linear forwards}
@keyframes wprog{from{width:0}to{width:100%}}
@media (max-width:760px){#wallBtn{display:none}.wallbar{left:8px;right:8px;bottom:8px;overflow-x:auto}}
/* 내려받기 버튼 */
.xbtns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.xbtns .btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);height:34px}
.xbtns .btn .ic{width:16px;height:16px;color:var(--accent)}
/* 관리기준 설정 */
.cfgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cftbl{width:100%;border-collapse:collapse;font-size:13px}
.cftbl th{font-size:11.5px;color:var(--fg3);font-weight:600;text-align:left;padding:0 6px 6px;white-space:nowrap}
.cftbl td{padding:4px 6px;border-top:1px solid var(--line);white-space:nowrap}
.cftbl input[type=text]{width:84px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:13px;padding:0 8px;text-align:right}
.cftbl input[type=text]:focus{border-color:var(--accent);outline:none}
.cftbl input:disabled{opacity:.6}
.cftbl input[type=date],.cftbl select{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:13px;padding:0 6px}
.cftbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
@media (max-width:760px){.cfgrid{grid-template-columns:1fr}#cfgBtn{display:none}}
.prange{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg2)}
.prange input{height:30px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:13px;padding:0 8px}
.prange input:focus{border-color:var(--accent);outline:none}
.rpbar{box-shadow:none;background:var(--card);flex-wrap:wrap;justify-content:flex-end;max-width:none}
@media (min-width:1100px){.rpbar{flex-wrap:nowrap}}
.rpbar .plong{display:none}
.pnow{height:30px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft)}
.phint{height:30px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);white-space:nowrap}
@media (max-width:1500px){.pbar .seg button{padding:6px 8px;font-size:12.5px}.plong{display:none}}
.kpis::-webkit-scrollbar{display:none}
.kpis .kpi{flex:1 0 196px;max-width:236px}
@media (min-width:761px){.kpis{pointer-events:none;padding-bottom:120px;margin-bottom:-120px}.kpis .kpi{pointer-events:auto}}   /* 도움말이 잘리지 않게 아래 여백 (지도 조작은 통과) */
.kpi .kl{gap:5px}
.kpis .kpi{gap:10px;padding:14px 12px}
.kpis .kpi .kic{width:34px;height:34px;border-radius:10px}
@media (max-width:1700px){.kpis .kpi .kic{display:none}.kpis .kpi{padding:13px 14px}}   /* 좁은 화면: 제목·선택이 잘리지 않게 아이콘 숨김 */
.kpis .kpi [data-tip]:hover::after,.kpis .kpi [data-tip]:focus-visible::after{left:auto;right:-6px;transform:none}
.kpis .kpi:first-child [data-tip]:hover::after,.kpis .kpi:first-child [data-tip]:focus-visible::after{left:-6px;right:auto}
.klt{white-space:nowrap;flex:none}
.vtag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--fg2);background:var(--idle-soft);border-radius:6px;padding:1px 5px}
.ksel{position:relative;display:inline-flex;align-items:center;flex:0 1 auto;min-width:0}
.kselv{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;height:22px;line-height:22px;padding:0 18px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ksel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font:inherit;font-size:14px;border:0}   /* 실제 선택은 기본 select (휴대폰에서도 동작), 보이는 건 현재 값만 */
.ksel:hover .kselv{filter:brightness(.97)}
.ksel:focus-within{outline:2px solid var(--accent);outline-offset:1px;border-radius:8px}
.ksel .ic{position:absolute;right:3px;width:13px;height:13px;color:var(--accent);pointer-events:none}
.ksel select option{color:var(--fg);background:var(--card)}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi > div{min-width:0}
.kpi .kic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.kpi .kl{font-size:12px;color:var(--fg2);display:flex;align-items:center;gap:4px}
.kpi .kval{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.25;display:flex;align-items:baseline;gap:6px}
.kpi .kval small{font-size:12px;font-weight:600;color:var(--fg3)}
.kpi .ks{font-size:11.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.kpi .kl{white-space:nowrap}
.delta{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 5px}
.delta.wn{color:var(--warn);background:var(--warn-soft)}
.delta.up{color:var(--ok);background:var(--ok-soft)} .delta.dn{color:var(--bad);background:var(--bad-soft)} .delta.nt{color:var(--fg3);background:var(--idle-soft)}
.ctrls{position:absolute;top:16px;right:372px;display:flex;flex-direction:column;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:4px;z-index:5;transition:right .3s var(--ease)}
.ctrls button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg2)}
.ctrls button:hover{background:var(--preview);color:var(--accent)}
.ctrls hr{border:0;height:1px;background:var(--line);margin:3px 6px}
.views.nodetail .ctrls{right:16px}
.vchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}

.detail{top:16px;right:16px;width:344px;max-height:calc(100% - 340px);min-height:220px;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;transition:transform .32s var(--ease),opacity .32s var(--ease)}
.dp-head{display:flex;gap:12px;align-items:flex-start}
.dp-ico{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.dp-ico .ic{width:22px;height:22px}
.eyebrow{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.6px}
.dp-name{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-top:1px}
.dp-sub{font-size:12px;color:var(--fg3);margin-top:2px}
.dp-act{margin-left:auto;display:flex;gap:4px}
.dp-act button{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--fg3);border:1px solid var(--line)}
.dp-act button:hover{color:var(--accent);border-color:var(--accent)}
.dp-act .ic{width:16px;height:16px}
.dp-st{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg2);flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:8px;padding:4px 9px;white-space:nowrap}
.badge.s-ok{color:var(--ok);background:var(--ok-soft)}
.badge.s-warn{color:var(--warn);background:var(--warn-soft)}
.badge.s-bad{color:var(--bad);background:var(--bad-soft)}
.badge.s-act{color:var(--accent);background:var(--accent-soft)}
.badge.s-idle,.badge.s-none,.badge.s-stop{color:var(--fg2);background:var(--idle-soft)}
.bar{height:6px;border-radius:3px;background:var(--idle-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .6s var(--ease)}
.bar i.s-warn{background:var(--warn)} .bar i.s-bad{background:var(--bad)} .bar i.s-act{background:var(--accent)}
.barrow{display:flex;flex-direction:column;gap:6px}
.barrow .bl{display:flex;justify-content:space-between;font-size:12px;color:var(--fg3)}
.barrow .bl b{color:var(--fg);font-weight:700}
.spark{background:var(--preview);border-radius:14px;padding:10px 12px 6px}
.spark .sh{display:flex;justify-content:space-between;font-size:12px;color:var(--fg3);margin-bottom:2px}
.spark .sh b{color:var(--fg)}
.spark svg{width:100%;height:64px;display:block}
.kv{margin:0;display:flex;flex-direction:column}
.kv div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--fg2);display:flex;align-items:center;gap:6px;min-width:0}
.kv dd{margin:0;font-weight:700;text-align:right;white-space:nowrap}
.kv dd small{font-weight:500;color:var(--fg3);margin-left:3px}
.kv dd .lim{display:block;font-size:11px;font-weight:500;color:var(--fg3)}
.kv dt i{width:6px;height:6px;border-radius:50%;background:transparent;flex:none}
.kv dt i.s-warn{background:var(--warn)} .kv dt i.s-bad{background:var(--bad)}
.sect{font-size:12px;font-weight:700;color:var(--fg2);display:flex;justify-content:space-between;align-items:center}
.sect small{font-weight:500;color:var(--fg3)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{background:var(--preview);border-radius:12px;padding:8px 8px 7px;text-align:center}
.chip small{display:block;font-size:11px;color:var(--fg3)}
.chip b{font-size:14px}
.chip.s-warn b{color:var(--warn)} .chip.s-bad b{color:var(--bad)}
.kv .kvg{display:block;font-size:11.5px;font-weight:700;color:var(--fg3);padding:14px 0 2px;border-bottom:0;letter-spacing:.3px}
.kv .kvg:first-child{padding-top:0}
td.st-warn{color:var(--warn);font-weight:700} td.st-bad{color:var(--bad);font-weight:700}
.krw{cursor:pointer} .krw:hover td,.krw:focus-visible td{background:var(--card)}
.krw td:first-child{border-radius:10px 0 0 10px} .krw td:last-child{border-radius:0 10px 10px 0}
.card.full{grid-column:1/-1}
.pv .seg{align-self:flex-start}
.knav .dotst{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.knav .dotst.s-warn{background:var(--warn)} .knav .dotst.s-bad{background:var(--bad)} .knav .dotst.s-none,.knav .dotst.s-stop{background:var(--fg3)}
.knav small{font-size:11.5px;color:var(--fg3);font-weight:600}
.app.collapsed .side .knav small{display:none}
.note{font-size:11.5px;color:var(--fg3);line-height:1.5}

.lot{left:16px;bottom:16px;right:448px;max-width:820px;padding:16px 18px;display:flex;gap:16px;align-items:stretch}
.lot-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.lot-h{display:flex;align-items:center;gap:10px;font-weight:700}
.lot-h .ic{color:var(--accent)}
.lot-h small{margin-left:auto;font-weight:500;color:var(--fg3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:grid;grid-template-columns:repeat(6,1fr);position:relative}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center;min-width:0}
.step::before{content:"";position:absolute;top:17px;left:calc(-50% + 20px);right:calc(50% + 20px);height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--accent)}
.step .sb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--idle-soft);color:var(--fg3);position:relative;z-index:1}
.step .sb .ic{width:17px;height:17px}
.step.done .sb{background:var(--accent);color:var(--on-accent)}
.step.cur .sb{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 5px var(--accent-soft)}
.step b{font-size:12px;font-weight:700;white-space:nowrap}
.step small{font-size:11px;color:var(--fg3);white-space:nowrap}
.step.cur small{color:var(--accent);font-weight:600}
.lot-side{width:236px;flex:none;background:var(--preview);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fg2)}
.lot-side b.id{font-size:14px;color:var(--fg)}
.lot-side .row{display:flex;justify-content:space-between;gap:8px}
.lot-side .row span:last-child{color:var(--fg);font-weight:600;text-align:right}

.list{right:16px;bottom:16px;width:416px;padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px}
.list-h{display:flex;align-items:center;gap:10px}
.seg{display:inline-flex;background:var(--preview);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--fg2);white-space:nowrap;transition:background .2s var(--ease),color .2s}
.seg button em{font-style:normal;color:var(--fg3);font-weight:600;margin-left:4px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on em{color:var(--accent)}
.list-h small{margin-left:auto;color:var(--fg3);font-size:12px;white-space:nowrap}
.rows{max-height:212px;overflow:auto;margin:0 -6px}
.rw{display:grid;grid-template-columns:94px 1fr auto 52px 14px;gap:10px;align-items:center;padding:9px 6px;border-radius:12px;width:100%;text-align:left}
.rw:hover{background:var(--preview)}
.rw.on{background:var(--accent-soft)}
.rw .a b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .a small{display:block;font-size:11px;color:var(--fg3);white-space:nowrap}
.rw .d{font-size:12px;color:var(--fg2);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .d i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.rw .p{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg3);text-align:right}
.rw .ic{width:14px;height:14px;color:var(--fg3)}
.fab{display:none}
.sheet-handle{display:none}

/* ---------- report & alarm ---------- */
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.banner{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent);border-radius:16px;padding:12px 16px;font-size:13px;font-weight:600}
.banner span{color:var(--fg2);font-weight:500}
.headline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.headline .eb{font-size:13px;color:var(--fg3);font-weight:600;margin-bottom:8px}
.headline h1{font-size:30px;line-height:1.32;letter-spacing:-.6px;margin:0;font-weight:800;text-wrap:balance}
.headline h1 em{font-style:normal;color:var(--accent)}
.headline p{margin:8px 0 0;color:var(--fg3);font-size:13px}
.krow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1400px){.krow{grid-template-columns:repeat(3,minmax(0,1fr))}}
.krow .kpi{width:auto;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.w2{grid-column:span 2}
.pv{background:var(--preview);border-radius:14px;padding:16px;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}
.meta{padding:0 4px 4px;display:flex;gap:12px;align-items:flex-start}
.meta .n{font-weight:800;color:var(--accent);font-size:14px}
.meta b{display:block;font-size:15px}
.meta small{display:block;color:var(--fg3);font-size:12.5px;margin-top:2px;line-height:1.45}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tk{fill:var(--fg3);font-size:11px;font-family:var(--font)}
.chart .b{fill:var(--accent);opacity:.42}
.chart .b.now{opacity:1}
.chart .b.warn{fill:var(--warn);opacity:1}
.chart .tg{stroke:var(--fg2);stroke-dasharray:4 4;stroke-width:1.2}
.chart .tgl{fill:var(--fg2);font-size:11px;font-weight:600;font-family:var(--font)}
.chart .band{fill:var(--accent);opacity:.1}
.chart .lim{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .pt{fill:var(--accent)}
.chart .pt.bad{fill:var(--bad)}
.chart .area{fill:var(--accent);opacity:.08}
table.ks{width:100%;border-collapse:collapse;font-size:13px}
table.ks th{font-size:11.5px;color:var(--fg3);font-weight:600;text-align:left;padding:0 8px 8px;white-space:nowrap}
table.ks td{padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
table.ks td.r,table.ks th.r{text-align:right}
.tbl{overflow-x:auto}
.blt{display:flex;flex-direction:column;gap:6px}
.blt-h{display:flex;align-items:center;gap:8px;font-size:13px}
.blt-h b{margin-left:auto;font-size:15px}
.blt-t{position:relative;height:10px;border-radius:5px;background:var(--idle-soft)}
.blt-t .bd{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.22;border-radius:5px}
.blt-t .mk{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--accent)}
.blt-s{display:flex;justify-content:space-between;font-size:11px;color:var(--fg3)}
.hb{display:flex;flex-direction:column;gap:5px}
.hb .hl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg2)}
.hb .hl b{color:var(--fg)}
.issues{display:flex;flex-direction:column;gap:8px}
.iss{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;padding:10px 12px;font-size:12.5px}
.iss b{display:block;font-size:13px}
.iss small{color:var(--fg3)}
.alarm-list{display:flex;flex-direction:column;gap:10px}
.al{background:var(--card);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center}
.al .t{font-size:13px;color:var(--fg3);font-weight:600}
.al .t b{display:block;color:var(--fg);font-size:15px}
.al .m b{font-size:14px}
.al .m p{margin:3px 0 0;font-size:12.5px;color:var(--fg2)}
.al .m .tags{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.al .x{display:flex;gap:8px;align-items:center}
.btn{height:36px;padding:0 14px;border-radius:10px;font-weight:700;font-size:13px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.btn.ghost{background:var(--preview);color:var(--fg2)}
.btn:disabled{opacity:.5;cursor:default}
.filter{display:flex;gap:8px;flex-wrap:wrap}
.pctl{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pctl small{color:var(--fg3);font-size:12px}
.range{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-size:13px;color:var(--fg2)}
.range label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.range input{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;padding:0 10px}
.range input:focus{border-color:var(--accent);outline:none}
@media (max-width:760px){.pctl{align-items:flex-start}.range{justify-content:flex-start}}
.fchip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;color:var(--fg2);font-size:13px}
.fchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty-st{background:var(--card);border-radius:16px;padding:28px;text-align:center;color:var(--fg3)}
.foot{font-size:12px;color:var(--fg3);line-height:1.6}

[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:11.5px;font-weight:500;line-height:1.45;padding:7px 10px;border-radius:10px;width:max-content;max-width:240px;white-space:normal;z-index:50;pointer-events:none;text-align:left}
.tipi{width:14px;height:14px;color:var(--fg3);display:inline-grid;place-items:center}
.tipi .ic{width:14px;height:14px}

.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:100;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--bg);border-radius:14px;padding:11px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);animation:tin .35s var(--ease) both;pointer-events:auto}
.toast i{width:8px;height:8px;border-radius:50%;flex:none}
.toast.out{animation:tout .3s var(--ease) both}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(8px)}}
.tabbar{display:none}
.maptop{position:absolute;left:16px;right:16px;top:16px;z-index:6;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.maptop>*{pointer-events:auto}
.ptabs{position:relative;flex:0 1 auto;min-width:0;display:flex;gap:2px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:0 8px;max-width:calc(100% - 470px);overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.views.nodetail .ptabs{max-width:none}
.ptabs{max-width:none}
.ptabs button{position:relative;height:48px;padding:0 12px;font-weight:700;font-size:14px;color:var(--fg3);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
.ptabs button:hover{color:var(--fg2)}
.ptabs button::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);transform:scaleX(0);transition:transform .28s var(--ease)}
.ptabs button.on{color:var(--fg)}
.ptabs button.on::after{transform:scaleX(1)}
.ptabs .tdot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.ptabs .tdot.b{background:var(--bad)}
.kpis{top:76px}
.ctrls{top:76px}
.detail{top:76px;max-height:calc(100% - 400px)}
.dbtn{height:40px;padding:0 14px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.dbtn .ic{width:18px;height:18px}
.modal{position:fixed;inset:0;background:rgba(15,17,21,.45);z-index:80;display:grid;place-items:center;padding:16px;animation:fin .2s var(--ease)}
@keyframes fin{from{opacity:0}to{opacity:1}}
.mbox{background:var(--card);border-radius:var(--r);width:min(580px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);animation:tin .3s var(--ease)}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mh h2{margin:2px 0 0;font-size:20px;letter-spacing:-.3px}
.drop{border:1.5px dashed var(--line);border-radius:16px;background:var(--preview);padding:24px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;transition:border-color .2s var(--ease),background .2s var(--ease)}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:15px}
.drop small{color:var(--fg3)}
.drop .ic{width:30px;height:30px;color:var(--accent)}
.stat{background:var(--preview);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.stat .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stat .row > span:first-child{color:var(--fg3);white-space:nowrap}
.stat .row b{text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;font-size:12.5px}
.msg{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--fg);line-height:1.45}
.msg .ic{width:16px;height:16px;margin-top:1px;color:var(--warn)}
.msg.err{background:var(--bad-soft)} .msg.err .ic{color:var(--bad)}
.msg.ok{background:var(--ok-soft)} .msg.ok .ic{color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--fg2)}
.field input{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:0 12px;outline:none}
.field input:focus{border-color:var(--accent)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lnk{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.nogl{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg3);text-align:center;padding:24px}

@media (max-width:1380px){.lot-side{display:none}}
@media (max-width:1180px){.lot{display:none}.kpis{grid-template-columns:repeat(2,minmax(0,212px))}}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.krow{grid-template-columns:repeat(2,minmax(0,1fr))}.plant,.user{display:none}}
@media (max-width:760px){
  .side{display:none}
  .top{padding:0 16px;gap:8px;height:58px}
  .top .mbrand{display:flex}
  .top .mbrand span{display:none}

  .search kbd{display:none}
  .live b{display:none}
  .live{padding:6px 10px}
  .views{padding-bottom:0}
  .main{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .maptop{top:10px;flex-direction:column;gap:8px;align-items:stretch}
  .ptabs,.views.nodetail .ptabs{max-width:none;padding:0 4px}
  .pgl,.plong{display:none}
  .ptabs button{height:42px;font-size:13px;padding:0 10px}
  .kpis{display:flex;width:auto;left:0;right:0;top:106px;max-width:none;flex-wrap:nowrap;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
  .kpis::-webkit-scrollbar{display:none}
  .kpi{width:178px;flex:none;padding:12px 14px;gap:10px}
  .kpi .kic{width:34px;height:34px;border-radius:10px}
  .kpi .kval{font-size:19px}
  .ctrls,.views.nodetail .ctrls{right:16px;top:216px}
  .pbar{gap:4px;padding:4px;overflow-x:auto;scrollbar-width:none}
  .pbar::-webkit-scrollbar{display:none}
  .pbar .seg button{padding:5px 8px;font-size:12px}
  .plab{padding:0 6px;font-size:12.5px}
  .ctrls button{width:36px;height:36px}

const pad=n=>String(n).padStart(2,'0');
const hhmm=d=>pad(d.getHours())+':'+pad(d.getMinutes());

function paintIcons(root=document){$$('[data-ic]',root).forEach(el=>{if(el.dataset.done)return;el.insertAdjacentHTML('afterbegin',ic(el.dataset.ic));el.dataset.done=1;});}

/* =========================================================
   가상 공정 데이터 (모든 수치는 시연용 가상값)
   ========================================================= */
const ST={ok:'정상',warn:'주의',bad:'이탈',none:'데이터 없음',stop:'가동 중단'};
const RANK={none:-1,stop:-1,ok:0,warn:1,bad:2};
/* 가동 중단: 킬른은 DCS 원료 투입량 ≤ 1 t/h, DCS가 없으면 관리기준 설정의 정지·보수 기간(오늘 기준) */
function isStopped(e){if(!e)return false;if(e.kref)return isStopped(E[e.kref]);if(!e.kiln){if(e.id&&e.id[0]==='R'&&downOn(e.id,todayStr())==='stop')return true;if(!e.params.load||e.stop===undefined)return false;const l=e.params.load;if(l.has)return l.v<=5;return !!e.stop;}const f=e.params.feed;if(f.has)return f.v<=1;return !!downOn(e.id,todayStr());}
function P(label,unit,v,lo,hi,dp,noise,o={}){return Object.assign({label,unit,v,base:v,target:v,lo,hi,dp,noise,hist:[]},o);}
/* 분석 항목: 값은 QMS 데이터에서만 옵니다 (없으면 '—') */
const QA=(label,unit,dp,src,fld,o={})=>P(label,unit,0,null,null,dp,0,Object.assign({ana:1,src,fld,spc:1},o));
function pStatus(p){
  if(p.kid&&isStopped(E[p.kid]))return 'ok';
  if(p.ana&&!p.has)return 'ok';
  if(p.lo==null&&p.hi==null)return 'ok';
  if((p.hi!=null&&p.v>p.hi)||(p.lo!=null&&p.v<p.lo))return 'bad';
  const m=(p.lo!=null&&p.hi!=null)?(p.hi-p.lo)*0.1:Math.abs(p.hi??p.lo)*0.04;
  if((p.hi!=null&&p.v>p.hi-m)||(p.lo!=null&&p.v<p.lo+m))return 'warn';
  return 'ok';
}
const limTxt=p=>p.lo!=null&&p.hi!=null?`${p.limSrc==='spc'?'관리한계(±3σ)':'관리'} ${nf(p.lo,p.dp)}~${nf(p.hi,p.dp)}`:p.hi!=null?`관리 ${nf(p.hi,p.dp)} 이하`:p.lo!=null?`관리 ${nf(p.lo,p.dp)} 이상`:'';

function conveyor(pts,matKey,n,tab='shared'){

  const segs=[];let tot=0;
  for(let i=0;i<V.length-1;i++){
    const a=V[i],b=V[i+1],dir=b.clone().sub(a),L=dir.length();dir.normalize();
    const m=new THREE.Mesh(new THREE.BoxGeometry(L,.6,1.4),M.steel);
    m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(X,dir);add(m,par);
    const k=Math.floor(L/7);
    for(let s=1;s<=k;s++){const q=a.clone().lerp(b,s/(k+1));if(q.y>1.2){const h=q.y-.3;box(par,.35,h,.35,M.steelD,q.x,0,q.z);}}

  FLOWS.push({V,segs,tot,parts,par});

function stepTruck(t,dt){
  if(t.respawn>0){t.respawn-=dt;if(t.respawn<=0){newLot(t);t.i=1;t.x=t.route[0][0];t.z=t.route[0][1];t.s=0;t.state='진입';t.gone=false;}return;}
  if(t.wait>0){
    t.wait-=dt;
    const f=1-Math.max(0,t.wait)/(t.waitTot||1);
    if(t.loading)t.load=Math.min(t.cap,Math.max(t.load,t.cap*f));
    if(t.filling)t.load=t.cap*f;
    if(t.dumping)t.load=t.cap*(1-f);
    if(t.wait<=0){t.loading=t.filling=t.dumping=false;}
    return;
  }
  const w=t.route[t.i];const dx=w[0]-t.x,dz=w[1]-t.z,dist=Math.hypot(dx,dz);
  if(t.kind==='bct'&&TRUCKS.some(o=>o!==t&&o.kind==='bct'&&o.respawn<=0&&o.s>t.s&&o.s-t.s<11))return;
  const step=t.speed*dt;
  const tg=Math.atan2(-dz,dx);let dr=tg-t.g.rotation.y;while(dr>Math.PI)dr-=2*Math.PI;while(dr<-Math.PI)dr+=2*Math.PI;t.g.rotation.y+=dr*Math.min(1,dt*8);
  if(step>=dist){
    t.x=w[0];t.z=w[1];t.s+=dist;
    const o=w[2]||{};
    if(o.state)t.state=o.state;
    if(o.wait){t.wait=t.waitTot=o.wait;t.loading=!!o.load;t.filling=!!o.fill;t.dumping=!!o.dump;}
    if(o.state==='출하')t.doneAt=new Date();
    t.i++;
    if(o.end){E.DSP.params.ship.v+=t.load;t.gone=true;t.respawn=4+Math.random()*6;if(sel&&sel.type==='truck'&&sel.id===t.id)select(null);}
    if(t.i>=t.route.length)t.i=0;
  }else{t.x+=dx/dist*step;t.z+=dz/dist*step;t.s+=step;}
  t.g.position.set(t.x,0,t.z);
  if(t.g.userData.pile)t.g.userData.pile.visible=t.load>5;
}

function makeBracket(b,mat=M.line){
  const s=b.getSize(new THREE.Vector3()),mn=b.min,mx=b.max;const L=Math.min(s.x,s.y,s.z)*.28+.6;const v=[];
  for(const x of [mn.x,mx.x])for(const y of [mn.y,mx.y])for(const z of [mn.z,mx.z]){
    const sx=x===mn.x?1:-1,sy=y===mn.y?1:-1,sz=z===mn.z?1:-1;
    v.push(x,y,z,x+sx*Math.min(L,s.x/2),y,z, x,y,z,x,y+sy*Math.min(L,s.y/2),z, x,y,z,x,y,z+sz*Math.min(L,s.z/2));}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));const l=new THREE.LineSegments(g,mat);l.renderOrder=999;return l;}
function relatedIds(id){

  if(view!=='map')return;
  const k=REDUCED?1:1-Math.pow(.0015,dt);
  cam.tx+=(goal.tx-cam.tx)*k;cam.tz+=(goal.tz-cam.tz)*k;cam.dist+=(goal.dist-cam.dist)*k;cam.theta+=(goal.theta-cam.theta)*k;cam.phi+=(goal.phi-cam.phi)*k;
  applyCam();

    if(!st&&!REDUCED){k.spin.rotation.x+=dt*E[k.id].params.rpm.v*.12;k.hz.material.opacity=.4+.16*Math.sin(now/600+i);}
    if(k.hot!==!st){k.hot=!st;k.shm.map=k.hot?COLTEX:null;k.shm.needsUpdate=true;}
    k.shm.emissiveIntensity=st?0:(dark?1.35:1.15)+.25*pu;k.kl.intensity=st?0:(dark?1.8:1)+.4*pu;});
  BEACONS.forEach((b,i)=>{const on=!isStopped(E[b.kid]);const ph=REDUCED?1:((now/1000)%1<.5?1:0);   // 가동 중: 1초 주기로 깜빡임 (전 호기 같은 박자)
    b.lm.color.set(on?'#FF5A50':'#8B939E');b.lm.emissiveIntensity=on?(ph?2.1:.08):0;b.sp.visible=on&&!!ph;b.sp.material.opacity=dark?.95:.8;});
  PWW.forEach(w=>{if(!REDUCED&&EQOBJ[w.id].visible)w.wheel.rotation.y+=dt*1.4*E[w.id].params.load.v/80;});
  SMOKE.forEach(s=>{const u=s.userData;s.visible=EQOBJ[u.kid].visible&&!isStopped(E[u.kid]);u.t=(u.t+dt*u.v)%1;const t=u.t,k=u.k;s.position.set(u.x+t*6*k,u.y+t*14*k,u.z-t*3*k);s.scale.setScalar(1+t*3.4*k);s.material.opacity=(dark?.32:.45)*u.o*(1-t);});

function sparkSVG(p){
  let h=p.hist.slice(-60);if(h.length===1)h=[h[0],h[0]];if(!h.length)return '';const lo=Math.min(...h,p.lo??Infinity),hi=Math.max(...h,p.hi??-Infinity);

  if(p.lo!=null&&p.hi!=null)s+=`<rect class="band" x="0" y="${y(p.hi)}" width="${W}" height="${y(p.lo)-y(p.hi)}"/>`;

  const ids=val==='all'?kilnEqs().filter(e=>!L||e.line===L).map(e=>e.id):[val];
  const ps=ids.map(id=>[id,streamPer('clk:'+id,'fcao',r)]).filter(x=>x[1]),c={key,ic:'flask',l:'f-CaO',sel:{opts,val,aria:'f-CaO 호기 선택'},u:'%'};
  if(!ps.length)return Object.assign(c,{v:'—',s:noData(r,'클링커 시료'),tip:'QMS 클링커 시트의 f-CaO'});
  const W=ps.reduce((a,x)=>a+E[x[0]].cap,0),v=ps.reduce((a,x)=>a+x[1].avg*E[x[0]].cap,0)/W;
  const out=ps.reduce((a,x)=>a+x[1].vals.filter(y=>y[1]<FCAO_LIM[0]||y[1]>FCAO_LIM[1]).length,0),days=ps.reduce((a,x)=>a+x[1].n,0);
  const ok=v>=FCAO_LIM[0]&&v<=FCAO_LIM[1],rate=days?out/days*100:0,warn=ok&&rate>FCAO_WARN_RATE;
  return Object.assign(c,{v:nf(v,2),d:!ok?'이탈':warn?'주의':'정상',dc:!ok?'dn':warn?'wn':'up',s:val==='all'&&ps.length>1?`${perTxt(r)} · ${ps.length}개 호기 · 일평균 이탈 ${out}/${days}회(${nf(rate,0)}%) · QMS`:`${perTxt(r)} · 일평균 이탈 ${out}/${days}일(${nf(rate,0)}%) · QMS`,
    tip:`${PER_NM[PER.g]}: 호기별 일평균 f-CaO의 기간 평균${val==='all'?', 설계용량 가중평균':''}. 이탈은 일평균이 사내 관리기준 ${fcaoTxt()}를 벗어난 횟수${val==='all'?' (호기별 하루 1회로 셈)':''}. 평균이 기준 안이어도 이탈 비율이 ${FCAO_WARN_RATE}%를 넘으면 '주의'`});
}

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
/* 경영진 요약 02: 기간에 맞춘 생산 막대 (지도 카드와 같은 일별 값) */
function prodSeries(){
  const r=perRange(),ds=perDays(r),ks=kilnEqs();if(!ds.length)return null;
  const tot=d=>ks.reduce((a,e)=>a+kilnDay(e.id,d).tpd,0),src=ds.some(d=>ks.some(e=>kilnDay(e.id,d).src==='DCS'))?'DCS':'가상';
  if(ds.length===1){const d=ds[0];return {vals:ks.map(e=>kilnDay(e.id,d).tpd),labels:ks.map(e=>e.kiln+'호'),target:null,unit:'t/d',kind:'호기별',src};}
  if(ds.length<=62)return {vals:ds.map(tot),labels:ds.map(d=>`${+d.slice(5,7)}/${+d.slice(8)}`),target:runDesign()||DESIGN_TOTAL,unit:'t/d',kind:'일별',src};
  const m=new Map();ds.forEach(d=>{const k=d.slice(0,7),a=m.get(k)||{s:0,n:0};a.s+=tot(d);a.n++;m.set(k,a);});
  return {vals:[...m.values()].map(a=>a.s/a.n),labels:[...m.keys()].map(k=>`${k.slice(2,4)}.${+k.slice(5)}월`),target:runDesign()||DESIGN_TOTAL,unit:'t/d',kind:'월별 일평균',src};
}
function barChart(vals,labels,o){
  const w=560,h=220,L=48,R=10,T=14,B=26,iw=w-L-R,ih=h-T-B;
  const max=o.max||niceMax(Math.max(...vals.filter(v=>v!=null),o.target||0)*1.08);
  const y=v=>T+ih-v/max*ih;
  let s=`<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="${esc(o.aria)}">`;
  for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);s+=`<line class="gl" x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}"/><text class="tk" x="${L-8}" y="${yy+4}" text-anchor="end">${nf(v)}</text>`;}
  const bw=iw/vals.length;let lastI=-1;vals.forEach((v,i)=>{if(v!=null)lastI=i;});
  vals.forEach((v,i)=>{if(v==null)return;const x=L+i*bw+bw*.18,ww=Math.max(2,bw*.64),yy=y(v);const cls=o.low&&v<o.low?'b warn':(i===lastI?'b now':'b');
    s+=`<rect class="${cls}" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${ww.toFixed(1)}" height="${(T+ih-yy).toFixed(1)}" rx="${Math.min(4,ww/2).toFixed(1)}"><title>${labels[i]} · ${nf(v)} ${o.unit}</title></rect>`;});
  if(o.target){const yy=y(o.target);s+=`<line class="tg" x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}"/><text class="tgl" x="${w-R}" y="${yy-6}" text-anchor="end">설계 ${nf(o.target)}</text>`;}

}
function ctrlChart(vals,labels,o){

function qWindow(){
  if(!QD||!QD.to)return [null,null];
  const r=perRange(),t=todayStr();return [r.from,r.to>t?t:r.to];    // 지도 카드와 같은 기간 (일·월·년·기간 지정)
}
const winDays=()=>{const [a,b]=qWindow();return a?Math.round((dayDate(b)-dayDate(a))/864e5)+1:0;};
const winLabel=()=>{const [a,b]=qWindow();return a?`${a} ~ ${b} (${winDays()}일)`:'-';};
function qSeries(key,fld){
  const s=QD&&QD.streams[key];if(!s)return [];
  const [a,b]=qWindow();if(!a)return [];
  if(winDays()<=7){const fi=s.f.indexOf(fld);const lo=dayDate(a).getTime(),hi=dayDate(b).getTime()+864e5;
    const raw=fi<0?[]:s.r.filter(r=>r[1+fi]!=null).map(r=>[tsDate(r[0]),r[1+fi],1]).filter(x=>x[0].getTime()>=lo&&x[0].getTime()<hi);if(raw.length)return raw;}
  const di=s.df.indexOf(fld);if(di<0)return [];
  return s.d.filter(x=>x[2+di]!=null&&x[0]>=a&&x[0]<=b).map(x=>[dayDate(x[0]),x[2+di],0]);
}
const winAvg=(key,fld)=>{const v=qSeries(key,fld).map(x=>x[1]);return v.length?v.reduce((p,c)=>p+c,0)/v.length:null;};
function avgSeries(list){const m=new Map();list.flat().forEach(([d,v])=>{const k=d.toDateString();const a=m.get(k)||{d,s:0,n:0};a.s+=v;a.n++;m.set(k,a);});return [...m.values()].sort((a,b)=>a.d-b.d).map(a=>[a.d,a.s/a.n,0]);}
function thin(pts,max=150){if(pts.length<=max)return pts;const w=Math.ceil(pts.length/max),o=[];for(let i=0;i<pts.length;i+=w){const g=pts.slice(i,i+w);o.push([g[0][0],g.reduce((a,x)=>a+x[1],0)/g.length,0]);}return o;}

let afilter='all';

  const today=ALARMS.filter(a=>a.t.toDateString()===new Date().toDateString()).length;
  let list=ALARMS;
  if(afilter==='active')list=ALARMS.filter(alarmActive);
  if(afilter==='unack')list=ALARMS.filter(a=>!a.ack);
  if(afilter==='clear')list=ALARMS.filter(a=>!alarmActive(a));
  $('#alarms').innerHTML=`
  <div class="headline"><div><div class="eb">알람 · 관리기준 근접(주의)과 이탈 기록</div><h1>오늘 알람은 <em>${today}건</em>이고,<br>확인하지 않은 알람은 <em>${unack}건</em>입니다.</h1><p>현재 진행 중 ${active}건 · 가상 데이터</p></div>

  <div class="alarm-list">${list.length?list.map(a=>{const act=alarmActive(a);return `<div class="al"><div class="t"><b class="num">${hhmm(a.t)}</b>${a.t.toDateString()===new Date().toDateString()?'오늘':md(a.t)}</div>
   <div class="m"><div class="tags"><span class="badge s-${a.sev}">${ST[a.sev]}</span><span class="badge ${act?'s-act':'s-idle'}">${act?'진행 중':'해제됨'}</span>${a.ack?'<span class="badge s-idle">확인함</span>':''}</div><b>${E[a.eq].name} · ${a.label} ${a.val}</b><p>${a.lim} · ${AREA[E[a.eq].area].name} 구역 ${E[a.eq].code}</p></div>
   <div class="x"><button type="button" class="btn ghost" data-goto="${a.eq}">지도에서 보기</button>${a.ack?'':`<button type="button" class="btn" data-ack="${a.id}">확인</button>`}</div></div>`;}).join(''):'<div class="empty-st">이 조건에 맞는 알람이 없습니다.</div>'}</div>`;
  $$('[data-af]').forEach(b=>b.onclick=()=>{afilter=b.dataset.af;renderAlarms();});

  $$('[data-goto]').forEach(b=>b.onclick=()=>{location.hash='#map';setTimeout(()=>select({type:'eq',id:b.dataset.goto},{fly:true}),30);});
  const aa=$('#ackAll');if(aa)aa.onclick=()=>{ALARMS.forEach(a=>a.ack=true);toast(unack+'건을 확인 처리했습니다','ok');renderAlarms();updateBadges();};

function stepSupply(){
  OSP_DEF.forEach(o=>{const e=E[o.id];e.params.out.v=o.pw.reduce((a,p)=>a+E[p].params.rate.v,0);e.params.stock.v=e.cap*e.params.fill.v/100;});
  ['A','B'].forEach(L=>{const ys=PB_DEF.filter(d=>d.tab===L).map(d=>E[d.id]);
    ys.forEach(e=>{const f=e.params.fill,r=e.mode==='stack'?(f.v<100?.11:0):-.15;f.v=clamp(f.v+r*(.8+Math.random()*.4),0,100);e.params.stock.v=e.cap*f.v/100;});
    const rc=ys.find(e=>e.mode==='reclaim'),st=ys.find(e=>e.mode==='stack');
    if(rc&&st&&rc.params.fill.v<=4){rc.mode='stack';st.mode='reclaim';syncYardTags();
      toast(`${LINE_NM[L]} 프리블렌딩: ${st.n} 사용(Reclaiming) 시작 · ${rc.n} 적재(Stacking) 전환`,'act');}});
  syncYards();
}

function tick(){
  if(PER.follow&&PER.g!=='r'&&!perIsNow()){PER.a=todayStr();renderPbar();}   // 자정·월말·연말이 지나면 현재 기간으로
  if(MODE==='sim'){
    evTimer+=2;
    if(evTimer>=32){evTimer=0;const cand=allParams().filter(x=>x.p.ev&&!x.p.ana&&!x.p.has&&!(x.p.kid&&isStopped(E[x.p.kid])));const c=cand[Math.floor(Math.random()*cand.length)];const p=c.p;
      const span=p.lo!=null&&p.hi!=null?p.hi-p.lo:Math.abs(p.hi)*.1;p.target=p.hi-span*.04+Math.random()*span*.12;setTimeout(()=>{p.target=p.base;},16000+Math.random()*8000);}
    allParams().forEach(({e,k,p})=>{
      if(p.counter||p.derived||p.ana||p.has||(p.kid&&isStopped(E[p.kid])))return;
      p.v+=(p.target-p.v)*.14+gauss()*p.noise;
      if(p.min!=null)p.v=Math.max(p.min,p.v);if(p.max!=null)p.v=Math.min(p.max,p.v);
    });
    stepSupply();
    E.DSP.params.wait.v=TRUCKS.filter(t=>t.kind==='bct'&&t.respawn<=0&&(t.state==='진입'||t.state==='계량')).length;
    const lab=E.LAB.params;if(Math.random()<.15){lab.queue.v=clamp(lab.queue.v+(Math.random()<.5?-1:1),2,7);}lab.done.v=Math.min(100,lab.done.v+.05);
    SAMPLES.forEach(x=>{if(x.st==='분석중'||x.st==='채취'||x.st==='양생중'){x.prog=Math.min(x.st==='양생중'?99:100,x.prog+(x.st==='양생중'?.02:.8));if(x.prog>=100){x.st='완료';toast(`${x.id} 분석 완료 · ${x.what}`,'ok');}if(x.st==='채취'&&x.prog>30)x.st='분석중';}});
    allParams().forEach(({e,k,p})=>{if(p.ana||p.has)return;p.hist.push(p.v);if(p.hist.length>90)p.hist.shift();
      const st=pStatus(p);if(RANK[st]>RANK[p.prev]){pushAlarm(e,k,p,st);toast(`${e.name} ${p.label} ${nf(p.v,p.dp)}${p.unit} · ${ST[st]}`,st);}p.prev=st;});
  }
  const d=E.DSP.params;if(d.plan.v>0)d.prog.v=d.ship.v/d.plan.v*100;
  renderAll();
}

/* =========================================================
   QMS 데이터 — 분석값은 QMS 통합 업로드 양식(LIMS 원본 형식)에서 옵니다.
   ① 내장 기본 데이터 → ② 이 PC에 올린 파일(localStorage) → ③ 팀 공유 서버(server.py)
   ========================================================= */
const MAX_FILE=40*1024*1024;
/* 올린 파일·서버에서 온 글자(품명·비고·사일로 이름 등)에서 HTML 특수문자를 지움 — 화면에 코드가 끼어들지 못하게 */
const cleanQ=v=>typeof v==='string'?v.replace(/[<>&"'`]/g,''):Array.isArray(v)?v.map(cleanQ):(v&&typeof v==='object')?Object.fromEntries(Object.entries(v).map(([k,x])=>[cleanQ(k),cleanQ(x)])):v;
function applyQms(Q,meta,o={}){
  Q=cleanQ(Q);meta=cleanQ(meta||{});
  QD=Q;QMETA=meta||{};
  allParams().forEach(({e,k,p})=>{
    if(!p.src)return;
    if(p.ana){p.has=false;p.hist=[];p.times=[];p.lastTs=null;}
    const s=Q&&Q.streams[p.src];if(!s){if(!p.ana&&p.has){p.has=false;p.v=p.base0??p.v;}return;}
    const fi=s.f.indexOf(p.fld),mult=p.mult||1;
    let pts=fi<0?[]:s.r.filter(r=>r[1+fi]!=null).map(r=>[r[0],r[1+fi]*mult]);
    if(!pts.length){const di=s.df.indexOf(p.fld);if(di>=0){for(let i=s.d.length-1;i>=0;i--)if(s.d[i][2+di]!=null){const d=s.d[i][0];p.lastTs=Math.round(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))/60000)+720;break;}}
      if(!p.ana&&p.has){p.has=false;}return;}
    if(!p.ana&&p.base0===undefined)p.base0=p.v;
    pts=pts.slice(-90);p.hist=pts.map(x=>x[1]);p.times=pts.map(x=>tsDate(x[0]));p.v=p.base=p.target=p.hist[p.hist.length-1];p.time=p.times[p.times.length-1];p.has=true;
    if(p.spc){let st=s.st[p.fld];const pr=s.last&&s.last.product;if(p.spcProd&&s.stp&&pr&&s.stp[pr]&&s.stp[pr][p.fld])st=s.stp[pr][p.fld];
      if(st&&st[2]>=10&&st[1]>0){const r=v=>Number(v.toFixed(Math.max(p.dp,1)+1));p.lo=r((st[0]-3*st[1])*mult);p.hi=r((st[0]+3*st[1])*mult);p.limSrc='spc';}}
  });
  // C/M 현재 생산: QMS 시멘트밀 시트의 마지막 시료
  CM_DEF.forEach(d=>{const id='CM'+d.n,s=Q&&Q.streams['cem:'+id];CUR[id]=s&&s.last.product?{prod:s.last.product,silo:E[s.last.silo]?s.last.silo:(s.last.silo||null),siloLabel:s.last.siloRaw,clk:CUR0[id].clk,qms:1,ts:s.last.ts}:JSON.parse(JSON.stringify(CUR0[id]));});
  // 분석값 알람 재구성: 관리한계 근접·이탈로 바뀐 시점
  ALARMS=ALARMS.filter(a=>!(E[a.eq].params[a.k]||{}).ana);
  allParams().forEach(({e,k,p})=>{if(!p.ana||!p.has||(p.lo==null&&p.hi==null))return;const keep=p.v;let prev='ok';
    p.hist.forEach((v,i)=>{p.v=v;const st=pStatus(p);if(RANK[st]>RANK[prev])pushAlarm(e,k,p,st,p.times[i],true);prev=st;});p.v=keep;p.prev=pStatus(p);
    const last=ALARMS.find(a=>a.eq===e.id&&a.k===k);if(last&&RANK[p.prev]>0)last.ack=false;});
  ALARMS.sort((a,b)=>b.t-a.t);
  if(Q&&Q.samples){SAMPLES.length=0;Q.samples.slice(0,8).forEach((x,i)=>SAMPLES.push({id:'QMS-'+(i+1),what:x[2]+(x[3]?' · '+x[3]:''),eq:E[x[1]]?x[1]:'LAB',st:'완료',prog:100,time:tsDate(x[0])}));}
  if(sel&&sel.type==='eq')renderDetail();
  if(!o.quiet){setBracket();renderAll();}
  if($('#pbar'))renderPbar();
}

async function serverInit(){

  try{const r=await fetch('api/status',{cache:'no-store',credentials:'same-origin'});if(r.status===401){toLogin();return true;}if(!r.ok)return false;const s=await r.json();if(!s||s.app!=='blue365')return false;SERVER=s;SERVER.loaded=null;}catch(e){return false;}
  await loadMe();await pullCfg();await pullServer(true);setInterval(pollServer,20000);renderAll();return true;
}

async function logout(){try{await fetch('api/logout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:'{}'});}catch(e){}toLogin();}
async function pullServer(first){
  try{const r=await fetch('api/dataset',{cache:'no-store',credentials:'same-origin'});if(r.status===404)return;if(r.status===401){toLogin();return;}if(!r.ok)throw new Error();
    const ds=await r.json(),m=ds.meta||{};let Q=ds.qms;
    if(!Q&&ds.sheets)Q=QMS.build(ds.sheets,{down:CFG.down});          // 공유 폴더 자동 읽기: 원본 시트를 이 화면에서 집계
    if(!Q||!Q.streams)throw new Error();
    applyQms(Q,m);SERVER.loaded=m.version;
    if(!first)toast(`팀 데이터가 새로 반영되었습니다 · ${m.uploadedBy||''} ${m.uploadedAt?stamp(new Date(m.uploadedAt)):''}`,'ok');}
  catch(e){toast('팀 공유 데이터를 불러오지 못했습니다','warn');}
}
async function pollServer(){
  try{const r=await fetch('api/status',{cache:'no-store',credentials:'same-origin'});if(r.status===401){toLogin();return;}if(!r.ok)throw new Error();const s=await r.json();SERVER.ok=true;SERVER.needKey=s.needKey;SERVER.watch=s.watch;
    if(SERVER.me&&SERVER.me.role==='admin')loadMe();
    checkPageVersion(s);
    if(s.cfg!==undefined&&s.cfg!==SERVER.cfg&&$('#cfgModal').hidden)await pullCfg();
    if(s.version&&s.version!==SERVER.loaded){SERVER.version=s.version;await pullServer(false);}}
  catch(e){if(SERVER.ok!==false)toast('팀 공유 서버에 연결할 수 없습니다. 다시 연결되면 자동으로 이어집니다','warn');SERVER.ok=false;}
}

async function handleFiles(list){
  const files=[...list];const name=files.map(f=>f.name).join(', ');
  PENDING={fileName:name,busy:true};openModal();
  try{
    if(files.length!==1)throw new Error('QMS 통합 양식 엑셀 파일 1개를 올려 주세요.');
    const f=files[0];if(!/\.xlsx$/i.test(f.name))throw new Error(/\.xls[mb]?$/i.test(f.name)?`${f.name}: 이 형식은 읽을 수 없습니다. “Excel 통합 문서(.xlsx)”로 다시 저장해 주세요.`:`${f.name}: 엑셀(.xlsx) 파일만 올릴 수 있습니다.`);
    if(f.size>MAX_FILE)throw new Error('파일이 너무 큽니다 (최대 40MB).');
    const t0=performance.now();const sheets=await QMS.readXlsx(await f.arrayBuffer());const Q=QMS.build(sheets,{down:CFG.down});
    PENDING={fileName:name,Q,ms:Math.round(performance.now()-t0)};
    if(!Q.total)PENDING.err=['QMS 양식에 맞는 시트를 찾지 못했습니다. 3행 머리글(채취일·공정구분 등)을 확인해 주세요.'];
  }catch(e){PENDING={fileName:name,err:[e.message||'파일을 읽지 못했습니다.']};}
  renderDataModal();
}

const TE=new TextEncoder();

    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(lh.buffer),nb,d);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nb);off+=30+nb.length+d.length;}
  const cs=cen.reduce((a,x)=>a+x.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);

    const y0=QD&&QD.from?+QD.from.slice(0,4):+t.slice(0,4)-1,ys=[];for(let k=+t.slice(0,4);k>=Math.min(y0,+t.slice(0,4)-1);k--)ys.push(k);
    const ms=[];{let y=+t.slice(0,4),m=+t.slice(5,7);const lo=`${Math.min(y0,+PER.a.slice(0,4))}-01`;for(let i=0;i<240;i++){const k=`${y}-${pad(m)}`;if(k<lo)break;ms.push(k);if(--m<1){m=12;y--;}}}
    const pick=PER.g==='d'?`<input type="date" data-ppick="d" value="${PER.a}" max="${t}" aria-label="날짜 고르기">`:PER.g==='m'?`<select data-ppick="m" aria-label="월 고르기">${ms.map(k=>`<option value="${k}"${PER.a.slice(0,7)===k?' selected':''}>${k.slice(0,4)}년 ${+k.slice(5)}월</option>`).join('')}</select>`:
      `<select data-ppick="y" aria-label="연도 고르기">${ys.map(k=>`<option value="${k}"${+PER.a.slice(0,4)===k?' selected':''}>${k}년</option>`).join('')}</select>`;
    const nx=perRange(PER.g,perShift(PER.a,PER.g,1)).from>t;
    mid=`<div class="pnav"><button type="button" class="pbtn" data-pnav="-1" aria-label="이전 기간">${ic('chevL')}</button><label class="plab"><span>${r.lab}${PER.g!=='d'&&r.from<=t&&t<r.to?'<span class="plong"> · 진행 중</span>':''}</span>${pick}</label><button type="button" class="pbtn" data-pnav="1" aria-label="다음 기간"${nx?' disabled':''}>${ic('chevR')}</button></div>`+(perIsNow()?'':`<button type="button" class="pnow" data-pnow>${PER_NOW[PER.g]}로</button>`);
    if(l&&l<r.from)hint=`<button type="button" class="phint" data-phint title="QMS 데이터는 ${l}까지 있습니다"><span class="plong">QMS는 ${+l.slice(5,7)}/${+l.slice(8)}까지 · </span>${PER.g==='d'?(+l.slice(5,7))+'/'+(+l.slice(8)):PER.g==='m'?(+l.slice(5,7))+'월':l.slice(0,4)+'년'} 보기</button>`;
  }
  return seg+mid+hint;
}
function renderPbar(){const b=$('#pbar');if(b)b.innerHTML=perBarHTML();}
function setPer(g,a,range){
  if(g&&g!==PER.g){if(g==='r'){const c=perRange(),t=todayStr();PER.from=PER.from||c.from;PER.to=PER.to||(c.to>t?t:c.to);}else if(PER.g==='r'&&PER.to)PER.a=PER.to;PER.g=g;}
  if(a)PER.a=a>todayStr()?todayStr():a;
  if(range){let [f,t]=range;if(f>t)[f,t]=[t,f];const td=todayStr();if(t>td)t=td;if(f>td)f=td;PER.from=f;PER.to=t;}
  PER.follow=PER.g!=='r'&&perIsNow();
  renderPbar();renderKpis($('#kpiMap'),kpiCards(false));if(view==='report')renderReport(true);
}
function setupPeriod(){
  document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-pg],[data-pnav],[data-pnow],[data-phint]');if(!el)return;
    if(el.dataset.pg)return setPer(el.dataset.pg);
    if(el.dataset.pnav){const n=perShift(PER.a,PER.g,+el.dataset.pnav);return setPer(null,n);}
    if(el.hasAttribute('data-pnow'))return setPer(null,todayStr());
    if(el.hasAttribute('data-phint')){const l=qmsLast();if(!l)return;if(PER.g==='r'){const d=dayDate(l);d.setDate(d.getDate()-29);return setPer(null,null,[ymd(d),l]);}return setPer(null,l);}});
  document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||!el.value)return;
    if(el.dataset.prange){const r=el.dataset.prange==='from'?[el.value,PER.to]:[PER.from,el.value];if(r[0]>r[1])toast('시작일이 끝날보다 늦어 두 날짜를 바꿔 적용했습니다','act');return setPer(null,null,r);}
    if(!el.dataset.ppick)return;const g=el.dataset.ppick;
    setPer(null,g==='d'?el.value:g==='m'?el.value+'-01':el.value+'-01-01');});
  renderPbar();
}
/* 시작 */
setupPeriod();
paintIcons();
setupTheme();
setupShell();
setupSearch();
if(THREEOK)initScene();else{$('#stage').innerHTML='<div class="nogl">3D 라이브러리를 불러오지 못했습니다.<br>사내망이라면 오프라인 빌드 파일(cement_plant_3d.html)을 사용하세요.</div>';}
setupData();
setView(location.hash.slice(1)||'map');
select(sel);
renderAll();
setTimeout(()=>{if(!WALL.on)toast(isMobile()?'한 손가락으로 끌어 이동 · 두 손가락으로 확대·회전':'끌어서 이동 · 휠로 확대 · 오른쪽 버튼으로 끌면 회전','act');},900);
setInterval(tick,2000);
setupWall();
setupCfg();
requestAnimationFrame(frame);
})();
