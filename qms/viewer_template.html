<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Blue365 QMS 현황판</title>
<style>
/* 보는용 현황판 — Blue365 UI 스타일(docs/UI_디자인_가이드.md): 회색 바탕 + 흰 카드(둥근 20px) + 파란 강조 한 색.
   카드 = 위 회색 미리보기(well) + 아래 '01 제목 / 보조 설명'. 숫자는 아래 D(JSON)에서. 인터넷 없이 열림(글꼴은 PC 기본 글꼴). */
:root {
  --bg: #f2f4f6; --surface: #ffffff; --well: #f7f8fa; --ink: #191f28; --ink2: #333d4b; --muted: #6b7684; --faint: #8b95a1;
  --line: #e5e8eb; --primary: #3182f6; --primary-soft: #e8f3ff; --primary-ink: #1b64da; --on-primary: #ffffff;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --ok: #0ca30c; --warn: #fab219; --serious: #ec835a; --bad: #d03b3b;
  --ok-bg: #e8f7ec; --warn-bg: #fff4d9; --bad-bg: #fdecec; --band: rgba(49,130,246,.10);
  --shadow: 0 1px 2px rgba(0,0,0,.03), 0 6px 20px rgba(0,0,0,.045); --glow: 0 0 0 4px rgba(49,130,246,.14);
  --scrim: rgba(0,0,0,.42); --toast: #191f28; --toast-ink: #ffffff;
  --r-card: 20px; --r-well: 14px; --ease-out: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1);
  --f-body: "Pretendard", "Pretendard Variable", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101114; --surface: #1c1e23; --well: #25282e; --ink: #f2f4f6; --ink2: #d1d6db; --muted: #a0a9b3; --faint: #7d8792;
  --line: #30343b; --primary: #4593fc; --primary-soft: #1b2a42; --primary-ink: #8bbcff; --on-primary: #ffffff;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --ok-bg: #15301d; --warn-bg: #3a2f12; --bad-bg: #3b1a1a; --band: rgba(69,147,252,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.4); --glow: 0 0 0 4px rgba(69,147,252,.22); --toast: #f2f4f6; --toast-ink: #191f28; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101114; --surface: #1c1e23; --well: #25282e; --ink: #f2f4f6; --ink2: #d1d6db; --muted: #a0a9b3; --faint: #7d8792;
  --line: #30343b; --primary: #4593fc; --primary-soft: #1b2a42; --primary-ink: #8bbcff; --on-primary: #ffffff;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --ok-bg: #15301d; --warn-bg: #3a2f12; --bad-bg: #3b1a1a; --band: rgba(69,147,252,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.4); --glow: 0 0 0 4px rgba(69,147,252,.22); --toast: #f2f4f6; --toast-ink: #191f28; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;
       font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { line-height: 1.3; margin: 0 }
button { font: inherit; color: inherit }
a { color: var(--primary-ink) }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px }
.n, td.n, th.n { text-align: right; font-variant-numeric: tabular-nums }

/* ── 고정 헤더 + 상단 탭(밑줄) ── */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
       border-bottom: 1px solid transparent; transition: border-color .2s }
.top.scrolled { border-bottom-color: var(--line) }
.bar { display: flex; align-items: center; gap: 10px; min-height: 56px }
.brand { font-weight: 800; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; white-space: nowrap }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft) }
.tag { display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-ink); font-size: 12.5px; font-weight: 700; white-space: nowrap }
.tag.demo { background: var(--warn-bg); color: var(--ink2) }
.grow { flex: 1 }
.iconbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink2) }
.iconbtn:hover { background: var(--well) }
.iconbtn svg { width: 18px; height: 18px }
.toptabs { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none }
.toptabs button { position: relative; border: 0; background: none; padding: 8px 0 12px; cursor: pointer; color: var(--faint); font-size: 15px; font-weight: 700; white-space: nowrap }
.toptabs button[aria-selected="true"] { color: var(--ink) }
.toptabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px; border-radius: 2px; background: var(--ink) }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 800; line-height: 1; margin-left: 4px; vertical-align: 2px }

/* ── 배너(맨 위 안내, 닫기 ×) ── */
.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--primary-soft); color: var(--ink2); border-radius: 14px; padding: 11px 14px; margin-top: 14px; font-size: 14px }
.banner.warn { background: var(--warn-bg) }
.banner .ic { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; margin-top: 1px }
.banner.warn .ic { background: var(--warn); color: #1d1d1d }
.banner p { margin: 0; flex: 1 }
.banner button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px }

/* ── 화면 머리: 알약 꼬리표 + 큰 두 줄 제목(핵심 단어만 파랑) ── */
.page { padding-block: 22px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; animation: fadeThrough .26s var(--ease-out) both }
.page > *, .ctrl > div { min-width: 0; max-width: 100% }
.crumb { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--muted) }
.crumb a { color: var(--muted); text-decoration: none } .crumb a:hover { color: var(--ink) }
.crumb .back { display: inline-flex; align-items: center; gap: 4px; color: var(--primary-ink); font-weight: 700; cursor: pointer; border: 0; background: none; padding: 0 }
.hl { font-size: clamp(27px, 4.4vw, 40px); font-weight: 800; letter-spacing: -.025em; line-height: 1.25; margin-top: 10px }
.hl em { font-style: normal; color: var(--primary) }
.lead { color: var(--muted); font-size: 14.5px; margin: 8px 0 0 }
.sec { font-size: 17px; font-weight: 800; letter-spacing: -.01em; margin: 10px 0 -4px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
.sec small { font-size: 13px; font-weight: 500; color: var(--muted) }

/* ── 카드(흰 카드 + 회색 미리보기 + 번호 제목) ── */
.grid { display: grid; gap: 14px }
.g-auto { grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)) }
.g-stage { grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)) }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.g12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) }
.card { background: var(--surface); border-radius: var(--r-card); padding: 12px; box-shadow: var(--shadow); border: 2px solid transparent; min-width: 0;
        animation: rise .34s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 35ms); transition: border-color .2s, box-shadow .2s, transform .25s var(--spring) }
.card.pad { padding: 18px 20px }
.card.click { cursor: pointer } .card.click:hover { transform: translateY(-2px) }
.card.sel { border-color: var(--primary); box-shadow: var(--shadow), var(--glow) }
.well { background: var(--well); border-radius: var(--r-well); padding: 16px; min-height: 112px; display: grid; align-content: center; gap: 4px; position: relative }
.cap { padding: 12px 6px 4px }
.cap .t { font-size: 16px; font-weight: 800; letter-spacing: -.01em; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap }
.no { color: var(--primary); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums }
.cap small { display: block; color: var(--faint); font-size: 13px; margin-top: 2px }
.big { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15 }
.big span { font-size: 15px; font-weight: 700; color: var(--muted); margin-left: 3px }
.corner { position: absolute; top: 12px; right: 12px }
.card h3 { font-size: 16px; font-weight: 800; margin-bottom: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap }

/* ── 상태 칩(색 + 글자, 색만으로 구분하지 않음) ── */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; color: var(--ink2) }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50% }
.ok { background: var(--ok-bg) } .ok::before { background: var(--ok) }
.warn { background: var(--warn-bg) } .warn::before { background: var(--warn) }
.bad { background: var(--bad-bg) } .bad::before { background: var(--bad) }
.mute { background: var(--well) } .mute::before { background: var(--faint) }
.card .mute { background: var(--bg) }

/* ── 세그먼트(하나만 고르는 짧은 선택지) · 칩(거르기) ── */
.ctrl { display: flex; gap: 14px 22px; flex-wrap: wrap; align-items: flex-end; min-width: 0 }
.ctrl .lab { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px }
.seg { display: inline-flex; background: var(--line); padding: 3px; border-radius: 12px; gap: 2px; max-width: 100%; overflow-x: auto }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 9px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background .2s, color .2s }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12) }
.chips { display: flex; gap: 8px; flex-wrap: wrap }
.chips button { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink2); border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .2s, border-color .2s }
.chips button[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-ink) }
.chips button[aria-pressed="true"]::before { content: "✓"; font-weight: 800 }
.chips .cnt { color: var(--faint); font-weight: 600; font-size: 13px }
.chips button[aria-pressed="true"] .cnt { color: var(--primary-ink) }
@media (max-width: 720px) { .chips.scrollx { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px } }

/* ── 목록·표 ── */
.list { display: grid }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 8px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 12px; transition: background .15s }
.li:last-child { border-bottom: 0 }
.li:hover { background: var(--well) }
.li.sel { background: var(--primary-soft) }
.li .main b { font-weight: 700 } .li .main small { display: block; color: var(--muted); font-size: 13px }
.chev { color: var(--faint); font-size: 18px }
table { border-collapse: collapse; width: 100%; font-size: 14px }
th { text-align: left; font-weight: 600; color: var(--faint); font-size: 12.5px; border-bottom: 1px solid var(--line); padding: 8px; white-space: nowrap }
td { border-bottom: 1px solid var(--line); padding: 9px 8px; vertical-align: middle }
tr:last-child td { border-bottom: 0 }
tr.selrow td { background: var(--primary-soft) }
.scroll { overflow-x: auto } .tall { max-height: 380px; overflow: auto }
.note { font-size: 13px; color: var(--muted); margin: 0 }

/* ── 그래프 ── */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 6px }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px }
.chart { position: relative } .chart svg { display: block; width: 100%; height: auto; touch-action: pan-y }
.axis text { fill: var(--faint); font-size: 11px }
.ctip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.12); white-space: nowrap; z-index: 2 }

/* ── 진행 링 · 진행 바 · 범위 바 · 평점 요약형 막대 ── */
.ring { display: grid; place-items: center; position: relative; width: 92px; height: 92px; margin: 0 auto }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg) }
.ring b { font-size: 21px; font-weight: 800 }
.ring circle { transition: stroke-dashoffset .9s var(--ease-out) }
.pbar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden } .pbar > i { display: block; height: 100%; border-radius: 999px; background: var(--primary); transition: width .7s var(--ease-out) }
.sum { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center }
.sum .tot { text-align: center } .sum .tot .big { font-size: 40px } .sum .tot small { color: var(--muted); font-size: 12.5px; display: block }
.sum .rows { display: grid; gap: 7px }
.sum .r { display: grid; grid-template-columns: 34px minmax(0, 1fr) 30px; gap: 8px; align-items: center; font-size: 13px; color: var(--muted) }
.sum .r .n { color: var(--ink2); font-weight: 700 }
.range { position: relative; height: 34px; margin: 14px 0 18px }
.range .trk { position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 4px; background: var(--line) }
.range .bd { position: absolute; top: 12px; height: 10px; border-radius: 6px; background: color-mix(in srgb, var(--primary) 28%, transparent) }
.range .pt { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--primary); border: 3px solid var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.25); transition: left .35s var(--spring) }
.range .mk { position: absolute; top: 4px; width: 2px; height: 26px; margin-left: -1px; background: var(--bad) }
.range .mk.l { background: var(--serious) }
.range .ml { position: absolute; top: -12px; font-size: 11px; color: var(--muted); transform: translateX(-50%); white-space: nowrap }

/* ── 단계 표시(세로 스테퍼) ── */
.steps { list-style: none; margin: 0; padding: 0; counter-reset: st }
.steps > li { position: relative; padding: 0 0 18px 46px; counter-increment: st }
.steps > li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-weight: 800; font-size: 14px }
.steps > li::after { content: ""; position: absolute; left: 14px; top: 34px; bottom: 4px; width: 2px; background: var(--primary-soft) }
.steps > li:last-child::after { display: none } .steps > li:last-child { padding-bottom: 0 }
.steps h4 { margin: 3px 0 4px; font-size: 15px; font-weight: 800 }
.steps ul { margin: 2px 0 0; padding-left: 18px }
.hstep { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; counter-reset: hs }
.hstep > div { position: relative; padding: 42px 10px 0 0; counter-increment: hs; font-size: 14px }
.hstep > div::before { content: counter(hs); position: absolute; top: 0; left: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-weight: 800 }
.hstep > div::after { content: ""; position: absolute; top: 14px; left: 36px; right: 6px; height: 2px; background: var(--primary-soft) }
.hstep > div:last-child::after { display: none }
.hstep b { display: block; font-size: 15px }
.hyp { display: grid; grid-template-columns: 60px minmax(0, 1fr) minmax(70px, 22%) 104px; gap: 6px 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px }
.hyp:last-child { border-bottom: 0 }
.hyp .ax { font-weight: 700; color: var(--muted); font-size: 13px }

/* ── 직접 입력(라벨은 칸 위에 — 자리표시자로 대신하지 않음) ── */
.calc { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px }
.calc label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 5px }
.calc input { font: inherit; width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums; transition: border-color .15s, box-shadow .15s }
.calc input:focus { outline: none; border-color: var(--primary); box-shadow: var(--glow) }
.calc input.err { border-color: var(--bad) }
.ferr { color: var(--bad); font-size: 12.5px; margin-top: 4px }

/* ── 빈 화면 ── */
.empty { display: grid; place-items: center; text-align: center; gap: 6px; color: var(--muted); background: var(--well); border-radius: var(--r-well); padding: 28px 16px; font-size: 14px }
.empty::before { content: ""; width: 40px; height: 40px; border-radius: 50%; background: var(--line) }

/* ── 툴팁(ⓘ 누르면 설명) ── */
.qi { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--faint); color: var(--faint); font-size: 11px; font-weight: 800; cursor: pointer; background: none; padding: 0; vertical-align: 1px; font-style: normal }
.qi:hover { border-color: var(--primary); color: var(--primary) }
.pop { position: fixed; z-index: 60; max-width: 280px; background: var(--toast); color: var(--toast-ink); font-size: 13px; line-height: 1.5; padding: 9px 12px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: fadeIn .15s var(--ease-out) }

/* ── 토스트 ── */
.toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 70; background: var(--toast); color: var(--toast-ink);
         padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; pointer-events: none; transition: opacity .2s, transform .3s var(--spring); white-space: nowrap }
.toast.on { opacity: 1; transform: translate(-50%, 0) }

/* ── 모달(넓은 화면) / 바텀시트(휴대폰) ── */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: grid; place-items: center; padding: 16px; animation: fadeIn .2s var(--ease-out) }
.sheet { background: var(--surface); color: var(--ink); border-radius: 22px; width: min(460px, 100%); padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.25); animation: pop .26s var(--spring); display: grid; gap: 12px }
.sheet h3 { font-size: 19px; font-weight: 800 }
.sheet .grab { display: none }
.btns { display: flex; gap: 8px; margin-top: 4px }
.btn { flex: 1; height: 48px; border-radius: 14px; border: 0; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--well); color: var(--ink2) }
.btn.primary { background: var(--primary); color: var(--on-primary) }
.kv { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px 10px; font-size: 14px } .kv dt { color: var(--muted) } .kv dd { margin: 0 }

/* ── 하단 탭바(휴대폰) · 맨 위로 버튼 · 코치마크 ── */
.tabbar { display: none }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
       background: var(--surface); color: var(--ink2); box-shadow: 0 6px 18px rgba(0,0,0,.16); display: grid; place-items: center; opacity: 0; transform: scale(.7); pointer-events: none; transition: opacity .2s, transform .3s var(--spring) }
.fab.on { opacity: 1; transform: none; pointer-events: auto }
.coach { position: fixed; z-index: 65; max-width: 290px; background: var(--toast); color: var(--toast-ink); border-radius: 14px; padding: 12px 14px; font-size: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.25); animation: pop .3s var(--spring) }
.coach::before { content: ""; position: absolute; left: 26px; top: -6px; width: 12px; height: 12px; background: var(--toast); transform: rotate(45deg) }
.coach.up::before { top: auto; bottom: -6px }
.coach button { margin-top: 8px; border: 0; border-radius: 999px; background: var(--primary); color: #fff; font-weight: 700; padding: 5px 14px; cursor: pointer }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; display: grid; gap: 6px }

@media (max-width: 860px) { .g2, .g12 { grid-template-columns: 1fr } }
@media (max-width: 720px) {
  body { padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)) }
  .toptabs { display: none }
  .tabbar { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)) }
  .tabbar button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 4px 0; cursor: pointer; color: var(--faint); font-size: 10.5px; font-weight: 700; position: relative }
  .tabbar button svg { width: 22px; height: 22px }
  .tabbar button[aria-selected="true"] { color: var(--primary) }
  .tabbar .badge { position: absolute; top: 0; left: 52%; margin: 0; min-width: 16px; height: 16px; font-size: 10px }
  .fab { bottom: calc(84px + env(safe-area-inset-bottom, 0px)) }
  .toast { bottom: calc(88px + env(safe-area-inset-bottom, 0px)) }
  .scrim { place-items: end center; padding: 0 }
  .sheet { width: 100%; border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px)); animation: sheetUp .32s var(--ease-out) }
  .sheet .grab { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px }
  .hide-sm { display: none }
  .hyp { grid-template-columns: 52px minmax(0, 1fr) } .hyp .pbar, .hyp .vd { grid-column: 2 }
  .hstep { grid-template-columns: 1fr; gap: 14px } .hstep > div { padding: 2px 0 0 42px; min-height: 30px } .hstep > div::after { display: none }
  .big { font-size: 26px } .brand .full { display: none }
  .sum .tot .big { font-size: 34px }
}
@keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes fadeThrough { from { opacity: 0; transform: scale(.992) } to { opacity: 1; transform: none } }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes pop { from { opacity: 0; transform: scale(.94) } to { opacity: 1; transform: none } }
@keyframes sheetUp { from { transform: translateY(100%) } to { transform: none } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
@media print { .top, .tabbar, .fab, .banner button { display: none !important } .card { break-inside: avoid; box-shadow: none; border: 1px solid #ddd } }

<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><i></i>Blue365 QMS<span class="full">&nbsp;현황판</span></div>
      <span class="tag">보는용</span><span class="tag demo" id="demotag" hidden>데모</span>
      <span class="grow"></span>
      <button class="iconbtn" id="share" aria-label="공유"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span>공유</span></button>
    </div>

<div class="wrap"><footer>
  <div>이 파일은 매일 06:00 자동반영 때 새로 만들어집니다. 자료 올리기·관리기준 입력·보고서 만들기는 <b>관리용 앱</b>(Blue365 QMS)에서 합니다.</div>
  <div>KS 기준: KS L 5201(포틀랜드 시멘트) · 사내 관리기준은 관리용 앱 ⚙️ 설정의 값 · 예측값은 추정치이며 실측으로 확정해야 합니다.</div>
</footer></div>
<nav class="tabbar" id="tabbar" aria-label="화면"></nav>
<button class="fab" id="fab" aria-label="맨 위로"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const D = /*__DATA__*/null;
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const f = (v, k = 1) => (v == null || !isFinite(v) ? "-" : Number(v).toFixed(k));
const md = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
const ymd = (t) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SEVCLS = { "위험": "bad", "경고": "warn", "주의": "warn", "정상": "ok" };
const RANK = { "위험": 3, "경고": 2, "주의": 1, "정상": 0 };
const TONE = { ok: ["ok", "양호"], warn: ["warn", "확인 필요"], bad: ["bad", "기준 이탈"] };
const pill = (cls, t) => `<span class="pill ${cls}">${esc(t)}</span>`;
const COLORS = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const two = (i) => String(i + 1).padStart(2, "0");
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장 불가 환경 */ } } };
const GLOSS = {
  cpk: "Cpk(공정능력지수) = 평균이 관리기준 양쪽 끝에서 얼마나 떨어져 있는지(표준편차 3배 단위). 1.33 이상 충분, 1.0 미만 개선 필요.",
  rmse: "RMSE = 한 로트씩 빼고 학습해 그 로트를 예측했을 때의 평균 오차(LOO). 작을수록 잘 맞습니다.",
  r2: "R² = 예측이 실제 강도의 변동을 얼마나 설명하는지(0~1). 1에 가까울수록 좋습니다.",
  pi: "95% 구간 = 예측값 ± 1.96 × RMSE. 실제 값이 이 구간 안에 들어올 가능성이 약 95%(추정).",
  score: "근거 점수 = 공정 데이터로 자동 계산한 가설별 근거 강도(0~100). 확인 시험으로 확정해야 합니다.",
  ks: "KS 판정 = 채취일 연도의 KS L 5201 기준(관리용 앱 설정값)과 비교한 결과입니다.",
};
const qi = (k) => `<button class="qi" data-tip="${esc(GLOSS[k])}" aria-label="설명">i</button>`;
const ICON = {
  overview: '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
  monitor: '<path d="M3 17l5-6 4 3 7-8"/><path d="M3 21h18"/>',
  predict: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/>',
  diagnosis: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/>',
  shipment: '<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>',
  data: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
};
const svgI = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

if (!D) { $("view").innerHTML = '<div class="page"><div class="empty">자료를 불러오지 못했어요. 관리용 앱에서 현황판을 다시 만들어 주세요.</div></div>'; return; }
$("demotag").hidden = !D.meta.demo;

// ── 공통 조각 ────────────────────────────────────────────────────────
const head = (tag, h, lead, crumb = "") => `${crumb}<div><span class="tag">${esc(tag)}</span><h1 class="hl">${h}</h1>${lead ? `<p class="lead">${lead}</p>` : ""}</div>`;
const card = ({ no, title, en, well, i = 0, cls = "", attrs = "" }) =>
  `<div class="card ${cls}" style="--i:${i}" ${attrs}><div class="well">${well}</div><div class="cap"><div class="t">${no ? `<span class="no">${no}</span>` : ""}${title}</div>${en ? `<small>${en}</small>` : ""}</div></div>`;
const box = (inner, i = 0, cls = "") => `<div class="card pad ${cls}" style="--i:${i}">${inner}</div>`;
const seg = (id, opts, cur, fmt = (x) => x) => `<div class="seg" id="${id}" role="group">${opts.map((o) => `<button aria-pressed="${String(o) === String(cur)}" data-v="${esc(o)}">${esc(fmt(o))}</button>`).join("")}</div>`;
const chips = (id, opts, cur, fmt = (x) => esc(x), scroll = false) => `<div class="chips${scroll ? " scrollx" : ""}" id="${id}" role="group">${opts.map((o) => `<button aria-pressed="${String(o) === String(cur)}" data-v="${esc(o)}">${fmt(o)}</button>`).join("")}</div>`;
const pick = (id, opts, cur, fmt) => (opts.length <= 5 ? seg(id, opts, cur, fmt) : chips(id, opts, cur, (o) => esc(fmt ? fmt(o) : o), true));
const onPick = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", (e) => { const b = e.target.closest("button[data-v]"); if (b) fn(b.dataset.v); }); };
const legend = (items) => `<div class="legend">${items.map(([n, c, dash]) => `<span><i style="background:var(${c})${dash ? ";opacity:.6" : ""}"></i>${esc(n)}</span>`).join("")}</div>`;
const empty = (t) => `<div class="empty">${t}</div>`;
function ring(pct, color = "--primary") {
  const r = 40, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct));
  return `<div class="ring" role="img" aria-label="${p}%"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>`
    + `<circle cx="46" cy="46" r="${r}" fill="none" stroke="var(${color})" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - p / 100)).toFixed(1)}"/></svg><b>${p}%</b></div>`;
}
function statusIcon(s) {
  const c = { "정상": "--ok", "주의": "--warn", "경고": "--warn", "위험": "--bad" }[s] || "--faint";
  const p = s === "정상" ? '<path d="m7 12.5 3.2 3.2L17 9"/>' : s === "위험" ? '<path d="m8 8 8 8M16 8l-8 8"/>' : '<path d="M12 7v6"/><path d="M12 17h.01"/>';
  return `<svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(${c})"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${p}</g></svg>`;
}

// ── 토스트 · 툴팁 · 시트 · 배너 ────────────────────────────────────────
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2000); }
let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
document.addEventListener("click", (e) => {
  const b = e.target.closest(".qi");
  if (!b) { closePop(); return; }
  e.stopPropagation(); const same = popEl && popEl.dataset.for === b.dataset.tip; closePop(); if (same) return;
  popEl = document.createElement("div"); popEl.className = "pop"; popEl.role = "tooltip"; popEl.dataset.for = b.dataset.tip; popEl.textContent = b.dataset.tip; document.body.appendChild(popEl);
  const r = b.getBoundingClientRect(), w = popEl.offsetWidth, h = popEl.offsetHeight;
  popEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  popEl.style.top = (r.top - h - 8 > 60 ? r.top - h - 8 : r.bottom + 8) + "px";
});
addEventListener("scroll", closePop, { passive: true });
function sheet(html, onPrimary) {
  const s = document.createElement("div"); s.className = "scrim";
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const close = () => { s.remove(); document.removeEventListener("keydown", key); };
  const key = (e) => { if (e.key === "Escape") close(); };
  s.addEventListener("click", (e) => { if (e.target === s || e.target.closest("[data-close]")) close(); if (e.target.closest("[data-go]")) { close(); onPrimary && onPrimary(); } });
  document.addEventListener("keydown", key); document.body.appendChild(s); const b = s.querySelector("[data-go]") || s.querySelector("button"); b && b.focus();
}
function banners() {
  const out = [], gen = new Date(D.meta.generated.replace(" ", "T"));
  if (D.meta.demo) out.push(["", "i", "데모 데이터로 만든 예시 화면이에요. 실제 공장 자료가 아닙니다."]);
  const core = D.status.filter((r) => r.rows > 0 && r.last && /원료|킬른|소성|클링커|시멘트/.test(r.name));
  const old = core.map((r) => ({ r, d: Math.floor((gen - new Date(r.last)) / 864e5) })).filter((x) => x.d >= 3).sort((a, b) => b.d - a.d);
  if (old.length) out.push(["warn", "!", `${esc(old[0].r.name)} 자료가 ${old[0].d}일째 새로 들어오지 않았어요${old.length > 1 ? ` (외 ${old.length - 1}개)` : ""}. 데이터 현황 탭에서 확인하세요.`]);
  $("banners").innerHTML = out.map(([c, ic, t], i) => `<div class="banner ${c}" data-b="${i}"><span class="ic">${ic}</span><p>${t}</p><button aria-label="닫기">×</button></div>`).join("");
  $("banners").addEventListener("click", (e) => { if (e.target.closest("button")) e.target.closest(".banner").remove(); });
}

// ── 선 그래프(SVG, 눈금 하나, 호버 툴팁) ───────────────────────────────
function lineChart(host, { series, band, lines = [], dec = 1, unit = "", h = 300 }) {
  const all = series.flatMap((s) => s.data.filter((p) => p[1] != null));
  if (!all.length) { host.innerHTML = empty("이 기간에 값이 없어요."); return; }
  let lo = Math.min(...all.map((p) => p[1])), hi = Math.max(...all.map((p) => p[1]));
  for (const v of [...lines.map((l) => l.v), ...(band || [])]) if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const pad = (hi - lo) * 0.08 || 1, nonneg = lo >= 0; lo -= pad; hi += pad; if (nonneg) lo = Math.max(0, lo);   // 음수가 될 수 없는 값은 0 아래로 그리지 않음
  const W = Math.round(Math.max(320, Math.min(900, host.clientWidth || 900))), H = W < 600 ? Math.round(h * 0.8) : h, L = 46, R = 12, T = 14, B = 28;   // 화면 폭 그대로 그려 글자가 작아지지 않게
  const x0 = Math.min(...all.map((p) => p[0])), x1 = Math.max(...all.map((p) => p[0]));
  const X = (t) => L + (W - L - R) * (t - x0) / (x1 - x0 || 1), Y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const tk = []; for (let i = 0; i <= 5; i++) tk.push(lo + (hi - lo) * i / 5);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map((q) => q.name).join(", "))} 추이"><g class="axis">`;
  s += tk.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css("--line")}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${f(v, dec)}</text>`).join("");
  const nx = W < 600 ? 3 : 5; for (let i = 0; i <= nx; i++) { const t = x0 + (x1 - x0) * i / nx; s += `<text x="${X(t)}" y="${H - 8}" text-anchor="middle">${md(t)}</text>`; }
  s += "</g>";
  if (band && band[0] != null && band[1] != null) s += `<rect x="${L}" width="${W - L - R}" y="${Y(band[1])}" height="${Y(band[0]) - Y(band[1])}" rx="6" fill="${css("--band")}"/>`;
  for (const ln of lines) if (ln.v != null) s += `<line x1="${L}" x2="${W - R}" y1="${Y(ln.v)}" y2="${Y(ln.v)}" stroke="${css(ln.c)}" stroke-width="1.5" ${ln.dash ? 'stroke-dasharray="6 4"' : ""}/><text x="${W - R - 4}" y="${Y(ln.v) - 5}" text-anchor="end" font-size="11" fill="${css("--muted")}">${esc(ln.label)}</text>`;
  for (const q of series) {
    const pts = q.data.filter((p) => p[1] != null); if (!pts.length) continue;
    s += `<polyline fill="none" stroke="${css(q.color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${q.dash ? 'stroke-dasharray="5 4"' : ""} points="${pts.map((p) => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ")}"/>`;
    const e = pts[pts.length - 1]; s += `<circle cx="${X(e[0])}" cy="${Y(e[1])}" r="4.5" fill="${css(q.color)}" stroke="${css("--surface")}" stroke-width="2"/>`;
  }
  s += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="${css("--faint")}" visibility="hidden"/><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
  host.innerHTML = s + '<div class="ctip" hidden></div>';
  const svg = host.querySelector("svg"), tip = host.querySelector(".ctip"), xh = host.querySelector(".xh");
  svg.addEventListener("pointermove", (ev) => {
    const r = svg.getBoundingClientRect(), t = x0 + ((ev.clientX - r.left) * W / r.width - L) / (W - L - R) * (x1 - x0);
    const rows = series.map((q) => { let b = null; for (const p of q.data) if (p[1] != null && (!b || Math.abs(p[0] - t) < Math.abs(b[0] - t))) b = p; return b && { q, p: b }; }).filter(Boolean);
    if (!rows.length) return; const at = rows[0].p[0];
    xh.setAttribute("x1", X(at)); xh.setAttribute("x2", X(at)); xh.setAttribute("visibility", "visible");
    tip.innerHTML = `<div style="color:var(--muted)">${ymd(at)}</div>` + rows.map(({ q, p }) => `<div><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(${q.color});margin-right:6px"></i>${esc(q.name)} <b>${f(p[1], dec)}</b>${unit}</div>`).join("");
    tip.hidden = false; tip.style.left = Math.min(Math.max(ev.clientX - r.left + 12, 0), r.width - tip.offsetWidth) + "px"; tip.style.top = "8px";
  });
  svg.addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
}

// ── 탭(넓은 화면: 상단 탭 / 휴대폰: 하단 탭바) ─────────────────────────
const TABS = [["overview", "종합 현황"], ["monitor", "공정 모니터링"], ["predict", "강도 예측"], ["diagnosis", "원인 진단"], ["shipment", "출하시멘트"], ["data", "데이터 현황"]];
const SHORT = { overview: "현황", monitor: "모니터링", predict: "예측", diagnosis: "진단", shipment: "출하", data: "데이터" };
const st = { item: (D.monitor.items[0] || {}).key, line: "전체", prod: D.predict.products[0], age: 28, cat: (D.diagnosis.cats[0] || {}).name || "전체", ev: null,
             sprod: Object.keys(D.shipment.products)[0], from: null };

// ── 03 강도 예측 ─────────────────────────────────────────────────────
function rangeBar(y, lo, hi, ks, lsl) {
  const vals = [y, lo, hi, ks, lsl].filter((v) => v != null && isFinite(v)); const a = Math.min(...vals) - 2, b = Math.max(...vals) + 2;
  const P = (v) => (100 * (v - a) / (b - a)).toFixed(1) + "%";
  return `<div class="range" aria-hidden="true"><div class="trk"></div><div class="bd" style="left:${P(lo)};width:calc(${P(hi)} - ${P(lo)})"></div>`
    + (ks != null ? `<div class="mk" style="left:${P(ks)}"></div><div class="ml" style="left:${P(ks)}">KS ${ks}</div>` : "")
    + (lsl != null ? `<div class="mk l" style="left:${P(lsl)}"></div><div class="ml" style="left:${P(lsl)};top:30px">사내 ${lsl}</div>` : "")
    + `<div class="pt" style="left:${P(y)}"></div></div>`;
}
function predict() {

  const ages = P.ages.filter((a) => P.data[`${st.prod}|${a}`]);
  if (!ages.includes(st.age)) st.age = ages.includes(28) ? 28 : ages[ages.length - 1];
  const E = P.data[`${st.prod}|${st.age}`];
  if (!E) { view.innerHTML = `<div class="page">${head("강도 예측", "이 품종은 자료가<br><em>부족</em>해요", "")}${empty("다른 품종을 골라 보세요.")}</div>`; return; }
  const b = E.best, j = (v, lo) => (E.ks != null && v < E.ks ? pill("bad", "KS 미달 예측") : E.lsl != null && v < E.lsl ? pill("warn", "사내기준 미달 예측") : E.lsl != null && lo < E.lsl ? pill("warn", "하한 근접") : (E.ks == null && E.lsl == null ? pill("mute", "기준 미설정") : pill("ok", "양호")));
  view.innerHTML = `<div class="page">
    ${head("강도 예측 · 추정치", `${esc(st.prod)} ${st.age}일 강도,<br><em>미리</em> 알아봐요`, "앞 재령 강도·분말도·SO₃ 등으로 회귀 예측 · 로트마다 오차가 가장 작은 모델을 써요")}

    ${box(`${legend([[`${st.age}일 실측`, "--s1"], ["예측(결과 미도래)", "--s2", true]])}<div class="chart" id="pch"></div>
      <p class="note">${E.ks != null ? `빨간 선 = KS 하한 ${E.ks} MPa · ` : ""}${E.lsl != null ? `주황 점선 = 사내 하한 ${E.lsl} MPa` : "사내 하한 미설정"}</p>`)}
    <div class="grid g2">
      ${box(`<h3>값을 넣어 바로 예측</h3><p class="note" style="margin:-6px 0 12px">${esc(b.label)}</p><div class="calc" id="calc">${b.feats.map((x, i) => `<div><label for="cf${i}">${esc(x.label)}</label><input id="cf${i}" type="number" step="any" inputmode="decimal" value="${x.v == null ? "" : x.v}"></div>`).join("")}</div>

    </div>

  </div>`;
  lineChart($("pch"), { series: [{ name: `${st.age}일 실측`, color: "--s1", data: E.series.map((r) => [r.t, r.a]) }, { name: "예측", color: "--s2", dash: true, data: E.series.filter((r) => r.p != null).map((r) => [r.t, r.p]) }],
    lines: [E.ks != null ? { v: E.ks, c: "--bad", label: `KS ${E.ks}` } : null, E.lsl != null ? { v: E.lsl, c: "--serious", dash: true, label: `사내 ${E.lsl}` } : null].filter(Boolean), unit: " MPa" });

  $("calc").addEventListener("input", calc); calc();

}

      ${box(`<h3>이벤트 <span class="note">${list.length}건 · 최근·심각한 순</span></h3><div class="list tall" id="dtb">${list.map((x) =>
        `<div class="li${x === e ? " sel" : ""}" role="button" tabindex="0" data-id="${esc(x.id)}">${pill(SEVCLS[x.sev], x.sev)}<div class="main"><b>${esc(x.item)}${x.prod ? ` [${esc(x.prod)}]` : ""}</b><small>${esc(x.desc)} · ${esc(x.end)} · 최악 ${f(x.worst, 2)} ${esc(x.unit)}</small></div><span class="chev">${x.dx ? "›" : ""}</span></div>`).join("")}</div>`, 0)}
      ${e && e.dx ? box(`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pill(SEVCLS[e.sev], e.sev)}<span class="note">${esc(e.end)} 종료</span></div>
        <h3 style="font-size:19px;margin:8px 0 2px">${esc(e.dx.title)}${e.prod ? ` [${esc(e.prod)}]` : ""}</h3><p class="note" style="margin-bottom:16px">${esc(e.dx.impact)}</p>
        <ol class="steps">
          <li><h4>현상 정의·정량화</h4><div>${esc(e.dx.quant)}</div><div class="note" style="margin-top:4px">종합 판단 — ${esc(e.dx.summary)}</div></li>
          <li><h4>원인 가설 우선순위(5축) ${qi("score")}</h4>${e.dx.hyp.map(([ax, h, sc, v]) => `<div class="hyp"><span class="ax">${esc(ax)}</span><span>${esc(h)}</span><div class="pbar" title="근거 점수 ${sc == null ? "-" : sc}"><i style="width:${sc == null ? 0 : sc}%"></i></div><span class="vd">${esc(v)}</span></div>`).join("")}</li>
          <li><h4>확인 방법(데이터·시험)</h4><ul>${e.dx.verify.map((v) => `<li>${esc(v)}</li>`).join("")}</ul></li>
          <li><h4>단기 조치</h4><ul>${e.dx.short.map((v) => `<li>${esc(v)}</li>`).join("") || "<li>-</li>"}</ul><h4 style="margin-top:10px">근본 대책</h4><ul>${e.dx.root.map((v) => `<li>${esc(v)}</li>`).join("") || "<li>-</li>"}</ul></li>
          <li><h4>KS·관리기준 평가</h4><ul>${e.dx.ks.map((k) => `<li>${esc(k.item)}${k.prod && k.prod !== "-" ? ` [${esc(k.prod)}]` : ""}: KS ${esc(k.ks)} · 사내 ${esc(k.plant)}</li>`).join("") || "<li>-</li>"}</ul></li>
        </ol><p class="note" style="margin-top:14px">근거 점수·판정은 공정 데이터로 자동 계산한 결과예요. 원인은 확인 시험으로 확정하세요(추정 포함).</p>`, 1, "sel")
        : box(empty("이 이벤트의 상세 진단은 관리용 앱 🧪 원인 진단에서 볼 수 있어요.<br>현황판에는 분류마다 최근 대표 이벤트만 상세 진단을 넣어요."), 1)}
    </div></div>`;
  onPick("dc", (v) => { st.cat = v; st.ev = null; diagnosis(); });
  const sel = (r) => { st.ev = r.dataset.id; diagnosis(); if (innerWidth <= 860) view.querySelector(".card.sel")?.scrollIntoView({ behavior: "smooth", block: "start" }); };
  $("dtb").addEventListener("click", (ev) => { const r = ev.target.closest("[data-id]"); if (r) sel(r); });
  $("dtb").addEventListener("keydown", (ev) => { const r = ev.target.closest("[data-id]"); if (r && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); sel(r); } });
  const bk = $("back"); if (bk) bk.addEventListener("click", () => { st.from = null; go("overview"); });
}

// ── 05 출하시멘트 ────────────────────────────────────────────────────
function shipment() {
  const S = D.shipment.products, prods = Object.keys(S);
  if (!prods.length) { view.innerHTML = `<div class="page">${head("출하시멘트", "출하시멘트 자료가<br><em>아직</em> 없어요", "")}${empty("관리용 앱 🚢 출하시멘트에서 LIMS 파일을 올리면 여기에 나타나요.")}</div>`; return; }
  if (!prods.includes(st.sprod)) st.sprod = prods[0];
  const p = S[st.sprod], pct = p.n ? Math.round(100 * p.pass / p.n) : 0;
  view.innerHTML = `<div class="page">
    ${head(`출하시멘트 · ${p.first} ~ ${p.last}`, p.ks_set ? `${esc(st.sprod)} 최근 ${p.n}로트 중<br><em>${p.pass}로트</em> KS 적합` : `${esc(st.sprod)}는 KS 기준이<br><em>아직</em> 입력되지 않았어요`, "KS L 5201 · 채취일 연도의 기준을 적용해요")}
    <div class="ctrl"><div><span class="lab">품종</span>${pick("sp", prods, st.sprod)}</div></div>
    <div class="grid g12">
      ${card({ i: 0, no: "01", title: `KS 적합률 ${qi("ks")}`, en: `최근 ${p.n}로트 · 강도·화학·분말도`, well: p.ks_set ? ring(pct, pct === 100 ? "--ok" : "--bad") + `<div class="note" style="text-align:center">${p.pass}/${p.n} 로트</div>` : empty("KS 기준 미입력") })}
      ${box(`<h3>항목별 KS 판정</h3><div class="scroll"><table><thead><tr><th>항목</th><th class="n hide-sm">n</th><th class="n">평균</th><th class="n hide-sm">최소</th><th class="n hide-sm">최대</th><th class="n">KS 기준</th><th>판정</th></tr></thead><tbody>${p.rows.map((r) => `<tr><td><b>${esc(r.name)}</b></td><td class="n hide-sm">${r.n}</td><td class="n">${f(r.mean, r.dec)}</td><td class="n hide-sm">${f(r.min, r.dec)}</td><td class="n hide-sm">${f(r.max, r.dec)}</td><td class="n">${esc(r.ks)} ${esc(r.unit)}</td><td>${r.judge === "적합" ? pill("ok", "적합") : r.judge === "부적합" ? pill("bad", `부적합 ${r.n_bad}`) : pill("mute", r.judge)}</td></tr>`).join("")}</tbody></table></div>`, 1)}
    </div>
    ${box(`<h3>최근 로트</h3><div class="scroll"><table><thead><tr><th>채취일</th><th class="n">3일</th><th class="n">7일</th><th class="n">28일</th><th>KS</th></tr></thead><tbody>${p.recent.map((r) => `<tr><td>${esc(r.d)}</td><td class="n">${f(r.s3)}</td><td class="n">${f(r.s7)}</td><td class="n">${r.s28 == null ? '<span class="note">미도래</span>' : f(r.s28)}</td><td>${p.ks_set ? (r.ok ? pill("ok", "적합") : pill("bad", "부적합")) : pill("mute", "-")}</td></tr>`).join("")}</tbody></table></div>
      <p class="note" style="margin-top:8px">선박·양하지, 첨가재·석회석 비율 영향 분석은 관리용 앱 🚢 출하시멘트에서 볼 수 있어요.</p>`, 2)}
  </div>`;
  onPick("sp", (v) => { st.sprod = v; shipment(); });
}

// ── 06 데이터 현황 ───────────────────────────────────────────────────
function data() {
  const gen = new Date(D.meta.generated.replace(" ", "T"));
  const age = (r) => (r.last ? Math.max(0, Math.floor((gen - new Date(r.last)) / 864e5)) : null);
  view.innerHTML = `<div class="page">
    ${head(`데이터 현황 · 생성 ${D.meta.generated}`, `자료가 <em>언제까지</em><br>들어왔는지 봐요`, "현황판에 반영된 자료의 양과 기간")}
    <div class="grid g-auto">${D.status.map((r, i) => { const d = age(r);
      const tag = !r.rows ? pill("mute", "자료 없음") : d <= 2 ? pill("ok", "최신") : d <= 7 ? pill("warn", `${d}일 지남`) : pill("bad", `${d}일 지남`);
      return card({ i, no: two(i), title: esc(r.name), en: r.rows ? `${esc(r.first)} ~ ${esc(r.last)}` : "아직 올라온 자료가 없어요",
        well: `<div class="big">${r.rows.toLocaleString()}<span>행</span></div><div class="note" style="min-height:1.5em">${esc(r.lines) || "&nbsp;"}</div><div class="pbar" title="최신성"><i style="width:${r.rows ? Math.max(4, 100 - Math.min(100, (d || 0) * 100 / 14)) : 0}%"></i></div><span class="corner">${tag}</span>` }); }).join("")}</div>
    ${box(`<h3>자료는 이렇게 들어와요</h3><div class="hstep" style="margin-top:6px">
      <div><b>매일 06:00 자동</b><span class="note">공유 드라이브의 통합 업로드 파일(Blue365_QMS.xlsx)을 읽고 이 현황판을 새로 만들어요.</span></div>
      <div><b>바로 반영</b><span class="note">관리용 앱 📥 데이터 관리에서 파일을 올리고 ‘적용’을 눌러요.</span></div>
      <div><b>지난 현황</b><span class="note">같은 폴더의 ‘기록’ 폴더에 날짜별 현황판이 30일치 남아요.</span></div></div>`, 1)}
  </div>`;
}

// ── 처음 열었을 때 한 번만: 코치마크 ───────────────────────────────────
function coach() {
  if (store.get("b365_coach_v1")) return;
  const mobile = innerWidth <= 720, anchor = mobile ? $("tabbar") : $("tabs"); const r = anchor.getBoundingClientRect();
  const c = document.createElement("div"); c.className = "coach"; c.role = "dialog";
  c.innerHTML = `<b>여기서 화면을 바꿔요</b><div>알림을 누르면 원인 진단으로 바로 넘어가요.</div><button>알겠어요</button>`;
  document.body.appendChild(c);
  if (mobile) { c.classList.add("up"); c.style.left = "16px"; c.style.bottom = `${innerHeight - r.top + 12}px`; }
  else { c.style.left = `${Math.max(16, r.left)}px`; c.style.top = `${r.bottom + 10}px`; }
  c.querySelector("button").addEventListener("click", () => { c.remove(); store.set("b365_coach_v1", "1"); });
}

banners();
render(location.hash.slice(1));
setTimeout(coach, 600);
})();
</script>
</body>
</html>
